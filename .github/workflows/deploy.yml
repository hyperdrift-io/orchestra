name: Deploy to Hyperdrift Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: CI test gate (type-check + tests)
        run: npm run test:ci

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hyperdrift, deploy]
    concurrency:
      group: orchestra-production
      cancel-in-progress: false
    steps:
      - name: Deploy through Hyperdrift infrastructure
        run: |
          cd ~/dev/hyperdrift-infra
          git pull --ff-only
          PATH=$PATH:~/.local/bin make deploy-local app=orchestra
