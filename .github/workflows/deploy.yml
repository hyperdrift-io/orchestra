name: Verify production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: CI test gate (type-check + tests)
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Record the production deployment handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          ## Verification passed; deployment is separate
          This workflow has not deployed the site. The former webhook has no
          configured credentials, and the existing organisation runner has not
          accepted jobs from this public repository. Do not broaden runner access
          as a workaround. Deploy an approved revision through the Hyperdrift
          infrastructure repository with `make deploy app=orchestra`, then verify
          the live revision and launch readiness. See `docs/RELEASES.md`.
          NOTE
