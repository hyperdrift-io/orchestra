<!doctype html><meta charset="utf-8"><title>LangChain and Databricks AppKit: make streaming useful</title><style>
:root{--ink:#14120e;--cream:#f6eee1;--cream-2:#e2d8c8;--cream-3:#c8beae;--gold:#e3a857;--gold-light:#f4cd92;--gold-soft:#e3a85716;--gold-line:#e3a85766;--line-hair:#c8beae33;--line-soft:#c8beae44;--font-display:Georgia,serif;--font-body:Arial,sans-serif;--font-mono:Menlo,monospace;}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#14120e;color:#f6eee1;font:16px/1.5 Arial,sans-serif}p{margin:0} /* Article pages inherit the approved stone, ink and gold identity. */
body > header > p { font: 600 1.6rem/1 var(--font-display); }
body > header > p > a { display: inline-flex; align-items: center; gap: .7rem; }

body > header nav a[data-enquiry] { color: var(--gold-light); }
:is(#article, #articles, #article-series) :is(h1, h2, h3) a { border: 0; padding: 0; }
:is(#article, #articles, #article-series) small { color: var(--cream-3); font-size: .8rem; }
:is(#article, #articles) img { display: block; max-width: 100%; height: auto; }
:is(#article, #articles) figcaption { margin-top: .8rem; color: var(--cream-3); font-size: .8rem; line-height: 1.6; }
:is(#article, #articles) figure { margin: 2rem 0; }
:is(#article, #articles) :is(h2, section, aside) { scroll-margin-top: 2rem; }
#articles { padding: 5rem var(--edge) 0; }
#articles > header { max-width: 950px; padding-bottom: 5rem; }
:is(#articles, #article, #article-series) header > p:first-child { font: .75rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
#articles > header > small, #article > header > small { display: inline-block; margin-top: 1.5rem; border: 1px solid var(--gold-line); padding: .3rem .6rem; color: var(--gold-light); }
#articles h1 { margin-top: 1.5rem; font-size: clamp(3.5rem, 7vw, 7rem); line-height: .96; }
#articles > header > p:not(:first-child) { max-width: 54ch; margin-top: 2rem; font-size: 1.2rem; line-height: 1.7; }
#articles > header > a { display: inline-block; margin-top: 2rem; color: var(--gold-light); }
#articles > article { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; padding: 3rem 0; border-block: 1px solid var(--gold-line); }
#articles > article p:first-child { font: .75rem var(--font-mono); color: var(--gold); }
#articles > article h2 { font-size: clamp(2.5rem, 4vw, 4rem); margin: 1rem 0; }
#articles > article div > a { display: inline-block; margin-top: 1.5rem; color: var(--gold-light); }
#articles > article figure { margin: 0; transform: rotate(-1deg); }
#articles > article img { border: 1px solid var(--line-soft); box-shadow: 0 20px 60px #0006; }
#articles > ol { list-style: none; margin: 0; padding: 0; }
#articles > ol > li { display: grid; grid-template-columns: 4rem minmax(0, 1fr) 5rem; gap: 2rem; align-items: start; padding: 3rem 0; border-bottom: 1px solid var(--line-hair); }
#articles > ol > li > span { font: 2.8rem var(--font-display); color: var(--gold); }
#articles > ol p:first-child { font: .75rem var(--font-mono); color: var(--gold); text-transform: uppercase; letter-spacing: .1em; }
#articles > ol h2 { font-size: clamp(2rem, 3vw, 2.8rem); margin: .8rem 0 1rem; }
#articles > ol p { max-width: 66ch; }
#articles > ol small { display: block; margin-top: 1rem; }
#articles > ol > li > a { margin-top: 2.4rem; color: var(--gold-light); }

#articles > footer p { margin: .6rem 0 1rem; }
#article { max-width: 1320px; padding: 0 var(--gutter); margin: 0 auto; }
#article > header { padding: 1.4rem 0 1.5rem; max-width: 1040px; margin-inline: auto; }
#article > header nav { display: flex; gap: .8rem; font: .75rem var(--font-mono); color: var(--cream-3); }
#article > header nav a { color: var(--gold-light); }
#article > header > p:first-of-type { margin-top: 1rem; font: .75rem var(--font-mono); text-transform: uppercase; letter-spacing: .13em; color: var(--gold); }
#article h1 { margin: .65rem 0 .8rem; max-width: 29ch; font-size: clamp(2.2rem, 4.2vw, 3.8rem); line-height: 1.04; text-wrap: balance; }

#article > header > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1.2rem; margin-top: 1rem; padding-top: .65rem; border-top: 1px solid var(--line-hair); font-size: .8rem; color: var(--cream-3); }
#article a[data-enquiry] { color: var(--gold-light); }

#article-body blockquote p { font: 500 clamp(1.6rem, 2.5vw, 2rem)/1.15 var(--font-display); color: var(--gold-light); }

#article-body img { border: 1px solid var(--line-soft); }

#article-diagram { padding: 1.5rem; margin-block: 2rem; background: var(--ink-elev); border: 1px solid var(--gold-line); }

#article-diagram figcaption span { display: block; font: .7rem var(--font-mono); color: var(--gold); text-transform: uppercase; letter-spacing: .14em; }
#article-diagram strong { display: block; max-width: 38ch; font: 500 2rem/1.2 var(--font-display); color: var(--cream); margin-top: 1rem; }
#article-diagram ol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; padding: 0; margin: 2rem 0; list-style: none; counter-reset: steps; }
#article-diagram li { border-top: 1px solid var(--gold-line); padding-top: 1rem; color: var(--cream-2); counter-increment: steps; }
#article-diagram li::before { content: '0' counter(steps); display: block; font: .75rem var(--font-mono); color: var(--gold); margin-bottom: .8rem; }
#article-diagram > a { font-size: .8rem; color: var(--gold-light); }
#article-proof { max-width: 950px; margin: 2rem auto; }
#article-proof h2 { margin: 1rem 0; }
#article-proof > p { max-width: 65ch; }
#article-proof iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; }

#article-proof img { max-height: 520px; object-fit: contain; }
#article-proof details { margin-block: 1.5rem; border: 1px solid var(--line-soft); padding: 1rem; }
#article-proof summary { cursor: pointer; color: var(--gold-light); }
#enquire { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 2rem 0; border-top: 1px solid var(--gold-line); }
#enquire h2 { font-size: clamp(2.3rem, 3.5vw, 3.4rem); margin: .7rem 0; }
#enquire header > p:not(:first-child) { max-width: 35ch; line-height: 1.75; }
#enquire header small { display: block; margin-top: .8rem; }
form[aria-label='Discuss your workflow'] { min-width: 0; }
form[aria-label='Discuss your workflow'] fieldset { display: grid; gap: 1.3rem; margin: 0; padding: 0; border: 0; min-width: 0; }

form[aria-label='Discuss your workflow'] :is(input, textarea, select) { width: 100%; min-width: 0; min-height: 48px; padding: .75rem; border: 1px solid var(--line-soft); border-radius: 2px; background: var(--ink-elev); color: var(--cream); }
form[aria-label='Discuss your workflow'] :is(input, textarea, select):focus { outline: 2px solid var(--gold); outline-offset: 2px; }
form[aria-label='Discuss your workflow'] textarea { resize: vertical; line-height: 1.65; }
form[aria-label='Discuss your workflow'] button { justify-self: start; padding: 1rem 1.4rem; min-height: 48px; background: var(--gold); color: var(--ink); border: 1px solid var(--gold); border-radius: 2px; cursor: pointer; font-weight: 600; }
form[aria-label='Discuss your workflow'] button:hover { background: var(--gold-light); }

#article-series li { border-top: 1px solid var(--line-soft); }

@media (max-width: 850px) {
  #article > div { display: block; }

  #article > div > aside ol { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; margin: 1rem 0; }
  #articles > article { grid-template-columns: 1fr; gap: 2rem; }
  #article-series ol { grid-template-columns: 1fr 1fr; }

}
@media (max-width: 560px) {

  #article-series ol { grid-template-columns: 1fr; }
}

#article > header > figure { margin: 1rem 0 0; }
#article > header > figure img { width: 100%; height: 112px; object-fit: cover; background: var(--ink-elev); border: 1px solid var(--line-soft); }
#article > header > figure > a { display: block; border: 0; }

/* One shared end-cap, with native fallbacks and touch-sized text controls. */
#article-share { padding: 1.5rem 0 0; border-top: 1px solid var(--gold-line); }
#article-share > p:first-child { color: var(--cream); font-size: 1rem; }
#article-share > small { display: block; margin-top: .6rem; }
#article-share nav { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
#article-share nav :is(a, button) { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .65rem 1rem; border: 1px solid var(--gold-line); border-radius: 2px; background: transparent; color: var(--gold-light); font: .85rem/1.4 var(--font-body); text-decoration: none; cursor: pointer; }

#article-share [role='status'] { min-height: 1.5em; margin-top: .6rem; font-size: .85rem; color: var(--cream-2); }
#article-share label { display: grid; gap: .5rem; margin-top: .6rem; font-size: .85rem; }
#article-share input { width: 100%; min-width: 0; min-height: 44px; padding: .7rem; border: 1px solid var(--gold-line); background: var(--ink); color: var(--cream); }

/* The opening is a shallow editorial strip; evidence belongs inside the story. */
#article > header > small { margin-top: .7rem; padding: .15rem .4rem; font-size: .7rem; }
#article > header > div a { display: inline-flex; align-items: center; min-height: 36px; }
#article > div > aside a { display: inline-block; padding-block: .35rem; }
#article-diagram[data-has-visualization] { padding: 0; border: 0; background: transparent; max-width: 1040px; margin-inline: auto; }
@media (max-width: 650px) {
  #article > header > figure img { height: 80px; }
  #article > header > div { gap: .15rem 1rem; }
  #article > header > div a { min-height: 44px; }
  #article > header > p:first-of-type { font-size: .65rem; letter-spacing: .08em; }
  #article > header > p:last-of-type { font-size: 1rem; }
  #article-body > p { font-size: 1rem; }
}

#article form[aria-label='Discuss your workflow'] fieldset { gap: 1rem; }

/* Article-specific explanations: live type and deliberate states, no poster layout. */
#article-proof[data-article-visual] { margin: 1.5rem 0; max-width: none; --viz-teal: #90c5b8; --viz-red: #e8a18a; }
[data-visual] { padding: 0; overflow: hidden; border: 1px solid #655038; border-radius: 4px; background: radial-gradient(ellipse at 50% 0, #32281b 0, #191611 62%); }
[data-visual] > header { padding: 1.7rem 1.8rem 1.2rem; }
[data-visual] > header > p:first-child { font: .63rem var(--font-mono); letter-spacing: .14em; color: var(--gold); }

[data-visual] button:hover, [data-visual] button[aria-pressed=true] { color: var(--gold-light); background: var(--gold-soft); border-color: var(--gold); }
[data-visual] [data-refund] { display: flex; align-items: center; gap: 1.25rem; margin: 0 1.8rem 1.5rem; padding-block: .8rem; border-block: 1px solid var(--line-soft); }

[data-refund] > strong > span { font: .7rem var(--font-mono); margin-left: .5rem; color: var(--cream-3); }
[data-refund] > div { display: grid; gap: .25rem; }
[data-refund] > div > span { font: .55rem var(--font-mono); letter-spacing: .1em; color: var(--cream-3); }
[data-refund] code { font: .85rem var(--font-mono); color: var(--cream); }
[data-refund] small { font-size: .7rem; }
[data-refund] button { margin-left: auto; max-width: 155px; }
[data-models] { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin: 0 1.8rem 1.25rem; }
[data-model] { min-width: 0; padding: 0; }
[data-model] > header > span { color: var(--viz-teal); font: .6rem var(--font-mono); letter-spacing: .06em; }
[data-model=document] > header > span { color: var(--gold); }
[data-model] h4 { margin: .4rem 0 1.2rem; font: 500 1.3rem/1.2 var(--font-display); }
[data-model] h4 i { font-style: normal; color: var(--cream-3); }
[data-boundary] { position: relative; padding: 1.1rem .8rem .65rem; border: 1px solid var(--viz-teal); border-radius: 10px; background: linear-gradient(120deg, #90c5b80c, transparent 80%); }
[data-boundary-label] { position: absolute; top: -.4rem; left: .7rem; padding-inline: .4rem; background: #1d1a14; color: var(--viz-teal); font: .58rem var(--font-mono); letter-spacing: .05em; }
[data-boundary] ol { list-style: none; margin: 0; padding: 0; }
[data-boundary] li { position: relative; display: flex; align-items: center; gap: .65rem; padding: .5rem 0; }
[data-boundary] li:not(:last-child)::after { content: ''; position: absolute; left: .95rem; top: 2.65rem; width: 1px; height: .9rem; background: var(--viz-teal); }
[data-record] { display: grid; place-items: center; width: 2rem; height: 2rem; flex: 0 0 auto; border: 1px solid #90c5b866; border-radius: 4px; background: #25342f; color: var(--viz-teal); font: .9rem var(--font-mono); }
[data-boundary] li > div { display: grid; gap: .2rem; }
[data-boundary] li strong { font-size: .8rem; font-weight: 500; }
[data-boundary] li code { font: .65rem var(--font-mono); color: var(--cream-3); }
[data-record-value] { margin-left: auto; font: .7rem var(--font-mono); color: var(--viz-teal); }
[data-boundary] > p { margin: .7rem 0 0; padding-top: .65rem; border-top: 1px solid #90c5b833; font: .65rem/1.5 var(--font-body); color: var(--viz-teal); }
[data-model] > p { margin: .65rem 0 0; font: .7rem/1.5 var(--font-body); color: var(--cream-3); }
[data-boundary=document] { border-color: var(--gold); background: linear-gradient(120deg, #e3a8570c, transparent 80%); }

[data-document-fields] { display: flex; align-items: center; gap: .5rem; min-height: 149px; }
[data-document-fields] > span { font: 300 5.5rem/1 var(--font-display); color: var(--gold); }
[data-document-fields] > div { flex: 1; }
[data-document-fields] p { display: grid; gap: .25rem; margin: .7rem 0; }
[data-document-fields] code { color: var(--gold-light); font: .75rem var(--font-mono); }
[data-document-fields] p > span { font-size: .7rem; color: var(--cream-3); }
[data-separate] { display: flex; align-items: start; gap: .6rem; margin-top: .6rem; }
[data-separate] > span { color: var(--gold); font-size: 1.4rem; }
[data-separate] > div { display: grid; gap: .25rem; padding-top: .15rem; }
[data-separate] strong { font-size: .75rem; font-weight: 500; }
[data-separate] div > span { font: .65rem/1.5 var(--font-body); color: var(--cream-3); }
[data-payment] { display: flex; align-items: center; gap: .8rem; padding: 1rem 1.8rem; border-block: 1px dashed #b294704f; background: #08070444; }
[data-payment-mark] { display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold-light); font: 1.7rem var(--font-display); width: 2.5rem; height: 2.5rem; flex: 0 0 auto; }

[data-payment] strong { font: 500 1.2rem var(--font-display); }
[data-payment] > p { margin: 0 0 0 auto; font-size: .75rem; color: var(--cream-3); }
[data-visual] [data-outcome] { margin: 0; padding: 1.1rem 1.8rem; font: .8rem/1.6 var(--font-body); color: var(--cream-3); min-height: 117px; }
[data-outcome] strong { display: block; color: var(--cream); font-weight: 500; font-size: .95rem; margin-bottom: .3rem; }
[data-visual] > footer { padding: .75rem 1.8rem; border-top: 1px solid var(--line-hair); color: var(--cream-3); font: .6rem/1.5 var(--font-mono); }
[data-visual=streaming] > nav { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 1.8rem 1.25rem; gap: .4rem; }

[data-visual=streaming] > nav button > span { font: .6rem var(--font-mono); color: var(--gold); }
[data-sequence] { margin: 0 1.8rem; }
[data-lanes] { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; padding-bottom: .6rem; }
[data-lanes] > span { text-align: center; font: .65rem var(--font-mono); color: var(--cream); }
[data-lanes] > span:first-child { text-align: left; padding-left: 1rem; }
[data-lanes] > span:last-child { text-align: right; padding-right: 1rem; }
[data-lanes] small { display: block; font: .65rem var(--font-body); color: var(--cream-3); margin-top: .3rem; }
[data-sequence] svg { display: block; width: 100%; height: auto; overflow: visible; }
