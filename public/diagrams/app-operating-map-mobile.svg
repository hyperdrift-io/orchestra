<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1790" viewBox="0 0 390 1790" role="img" aria-labelledby="title desc"><title id="title">Orchestra OS: phone reading map</title><desc id="desc">A stacked accessible version of the conceptual operating map. This describes target relationships, not current universal availability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#82715a"/></marker></defs><rect width="390" height="1790" fill="#f6eee1"/><text x="20" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#62594c" text-anchor="start">ORCHESTRA OS / TARGET MAP</text><text x="20" y="76" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#14120e" text-anchor="start">Connect the app.</text><text x="20" y="110" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#14120e" text-anchor="start">Retain the evidence.</text><rect x="20" y="134" width="350" height="122" rx="10" fill="#14120e" stroke="#14120e" stroke-width="1.6"/><text x="38" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e3a857" text-anchor="start">PEOPLE + ACCEPTED SCOPE</text><text x="38" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6eee1" text-anchor="start">Founder direction</text><text x="38" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6eee1" text-anchor="start">Named CX + technical owners</text><text x="38" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6eee1" text-anchor="start">Specific authority and capacity</text><rect x="20" y="285" width="350" height="142" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="40" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">01</text><text x="40" y="350" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Build and release</text><text x="40" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Source / development → test</text><text x="40" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">→ admission → authorised release</text><path d="M195 427 V465" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="465" width="300" height="123" rx="10" fill="#14120e" stroke="#14120e" stroke-width="1.6"/><text x="195" y="497" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e3a857" text-anchor="middle">THE LIVE APP</text><text x="195" y="533" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f6eee1" text-anchor="middle">A useful customer action</text><text x="195" y="565" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#f6eee1" text-anchor="middle">Source + artifact + runtime identity</text><rect x="20" y="622" width="350" height="142" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="40" y="655" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">02</text><text x="40" y="687" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Run and recover</text><text x="40" y="719" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Observe the hosted service</text><text x="40" y="745" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Restore → verify → retain evidence</text><rect x="20" y="792" width="350" height="166" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="40" y="825" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">03</text><text x="40" y="857" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Protect and reconcile</text><text x="40" y="889" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Live finding → versioned repair</text><text x="40" y="915" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Test + deploy through admission</text><text x="40" y="941" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Return relevant changes to source</text><rect x="20" y="986" width="350" height="142" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="40" y="1019" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">04</text><text x="40" y="1051" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Reach and serve</text><text x="40" y="1083" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Named CX owner + scoped action</text><text x="40" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Communication, support and results</text><rect x="20" y="1156" width="350" height="142" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="40" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">05</text><text x="40" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Measure and decide</text><text x="40" y="1253" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Traction: context, work, outcomes</text><text x="40" y="1279" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Judgement + accepted next move</text><text x="20" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">Sources remain authoritative:</text><text x="20" y="1363" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">app transactions, payments, channels,</text><text x="20" y="1388" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">analytics. Traction links the evidence.</text><rect x="20" y="1430" width="350" height="170" rx="10" fill="#ece2d1" stroke="#82715a" stroke-width="1.6"/><text x="38" y="1460" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#62594c" text-anchor="start">THE OPERATING LOOP</text><text x="38" y="1490" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Evidence → judgement → authority</text><text x="38" y="1518" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">→ execution → receipt + result</text><text x="38" y="1546" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">→ Traction → the next decision</text><text x="20" y="1640" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">Each connection needs an owner,</text><text x="20" y="1665" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">scope and dated verification receipt.</text><text x="20" y="1690" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">The report separates current source</text><text x="20" y="1715" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#14120e" text-anchor="start">from proposed capabilities.</text><text x="20" y="1770" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#62594c" text-anchor="start">10 October 2026 · Review artifact</text></svg>