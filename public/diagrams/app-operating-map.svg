<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc"><title id="title">Orchestra OS: connect the app, retain the evidence</title><desc id="desc">Conceptual target relationship map. Named human owners and scoped authority surround a live app. Five service groups connect delivery, operation, security, customer work and decisions. Current implementation readiness is separate in the report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#82715a"/></marker></defs><rect width="1200" height="1360" fill="#f6eee1"/><text x="40" y="47" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#62594c" text-anchor="start">ORCHESTRA OS / CONCEPTUAL TARGET MAP</text><text x="40" y="98" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#14120e" text-anchor="start">Connect the app. Retain the evidence.</text><rect x="40" y="132" width="1120" height="80" rx="10" fill="#14120e" stroke="#14120e" stroke-width="1.6"/><text x="62" y="165" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e3a857" text-anchor="start">ACCOUNTABLE PEOPLE + ACCEPTED SCOPE</text><text x="62" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#f6eee1" text-anchor="start">Founder direction  ·  Named CX owner  ·  Technical owner  ·  Explicit authority</text><rect x="40" y="250" width="390" height="170" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="60" y="283" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">01</text><text x="60" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Build and release</text><text x="60" y="347" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Source / development → test</text><text x="60" y="373" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">→ deployment admission</text><text x="60" y="399" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Exact artifact + authorised release</text><rect x="770" y="250" width="390" height="170" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="790" y="283" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">02</text><text x="790" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Run and recover</text><text x="790" y="347" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Hosted runtime + availability</text><text x="790" y="373" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Observe → restore → verify</text><text x="790" y="399" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Recovery scope and owner</text><rect x="450" y="440" width="300" height="165" rx="10" fill="#14120e" stroke="#14120e" stroke-width="1.6"/><text x="600" y="482" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e3a857" text-anchor="middle">THE LIVE APP</text><text x="600" y="523" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#f6eee1" text-anchor="middle">A useful customer action</text><text x="600" y="560" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#f6eee1" text-anchor="middle">Transactions stay here</text><text x="600" y="587" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#f6eee1" text-anchor="middle">Source + artifact + runtime identity</text><path d="M430 340 H490 V440" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="477" y="432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="start">release</text><path d="M710 440 V340 H770" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="691" y="432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="start">live state</text><rect x="40" y="660" width="390" height="172" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="60" y="693" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">03</text><text x="60" y="725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Protect and reconcile</text><text x="60" y="757" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Finding → versioned repair record</text><text x="60" y="783" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Validate + deploy through admission</text><text x="60" y="809" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Reconcile relevant development lines</text><rect x="770" y="660" width="390" height="172" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="790" y="693" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">04</text><text x="790" y="725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Reach and serve</text><text x="790" y="757" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Named customer-success owner</text><text x="790" y="783" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Permitted communication / support</text><text x="790" y="809" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Action receipt + customer result</text><path d="M450 535 H405 V660" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">exposure / findings</text><path d="M40 737 H20 V350 H40" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="634" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">Recorded repair returns to source</text><path d="M800 660 V535 H750" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="815" y="575" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">customer actions</text><path d="M600 605 V875" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="624" y="727" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">Usage, health</text><text x="624" y="752" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">and results</text><rect x="430" y="875" width="340" height="145" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="450" y="908" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#62594c" text-anchor="start">05</text><text x="450" y="940" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#14120e" text-anchor="start">Measure and decide</text><text x="450" y="972" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Traction: context, work, outcomes</text><text x="450" y="998" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#14120e" text-anchor="start">Judgement + accepted next move</text><text x="40" y="867" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">Versioned change + receipt;</text><text x="40" y="891" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">never live files or secrets to Git.</text><text x="807" y="882" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">Each connection needs a scope,</text><text x="807" y="907" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="start">owner and verification receipt.</text><rect x="40" y="1060" width="1120" height="69" rx="10" fill="#ece2d1" stroke="#82715a" stroke-width="1.6"/><text x="62" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#62594c" text-anchor="start">AUTHORITATIVE SOURCES</text><text x="62" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#14120e" text-anchor="start">Customer records  ·  Payments  ·  Channels  ·  Analytics  →  references and snapshots in Traction</text><path d="M600 1060 V1020" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#62594c" text-anchor="start">THE OPERATING LOOP</text><rect x="40" y="1190" width="212" height="68" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="146" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#14120e" text-anchor="middle">Evidence</text><text x="146" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="middle">Notice</text><path d="M252 1224 H264" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><rect x="266" y="1190" width="212" height="68" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="372" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#14120e" text-anchor="middle">Judgement</text><text x="372" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="middle">Choose</text><path d="M478 1224 H490" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="1190" width="212" height="68" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="598" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#14120e" text-anchor="middle">Authority</text><text x="598" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="middle">Accept scope</text><path d="M704 1224 H716" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><rect x="718" y="1190" width="212" height="68" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="824" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#14120e" text-anchor="middle">Execution</text><text x="824" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="middle">Improve / release</text><path d="M930 1224 H942" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><rect x="944" y="1190" width="212" height="68" rx="10" fill="#fcf8f1" stroke="#82715a" stroke-width="1.6"/><text x="1050" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#14120e" text-anchor="middle">Receipt + result</text><text x="1050" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="middle">Learn</text><path d="M1050 1258 V1279 H148 V1258" fill="none" stroke="#82715a" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#62594c" text-anchor="middle">Return to Traction: what happened, what remains unknown, what changes next.</text><text x="40" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#62594c" text-anchor="start">Hosting, identities, secrets, routines and tool adapters support the whole map. Readiness is per app.</text></svg>