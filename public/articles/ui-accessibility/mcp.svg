<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="mcp-title mcp-desc"><title id="mcp-title">One sentence, two scopes, no send</title><desc id="mcp-desc">Illustrative request: “Find the release blockers and prepare a note for the team.” An assistant interprets it and keeps every source. The first part goes to a project tracker MCP server with a read-blockers scope; the second to a writing workspace with a create-draft scope. Each server checks its own permission. Sending to the team was not asked for and stays closed: delivery is the person’s decision. A correction, “use the mobile release, not the web release”, must replace the selection and revise the same draft. Proposed experiment, not yet run.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="1020" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 5 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">One sentence. Two scopes. <tspan fill="#f4cd92" class="x-i">No send</tspan>.</text><text x="56" y="182.58" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Your sentence can cross apps. Your permission should not grow on the way.</text><text x="56" y="284" class="x-i" font-size="38" fill="#f6eee1" text-anchor="start">“<tspan fill="#90c5b8">Find the release blockers</tspan> and <tspan fill="#f4cd92">prepare a note</tspan> for the team.”</text><path d="M64 296L398 296" fill="none" stroke="#90c5b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M468 296L632 296" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="231" y="324" class="x-m" font-size="13" fill="#90c5b8" text-anchor="middle">1 · READ</text><text x="550" y="324" class="x-m" font-size="13" fill="#e3a857" text-anchor="middle">2 · WRITE</text><text x="800" y="324" class="x-m" font-size="13" fill="#e8a18a" text-anchor="middle">SEND? NOT ASKED</text><rect x="300" y="366" width="400" height="78" rx="12" fill="#221e18" stroke="#c8beae" stroke-width="1.2"/><text x="500" y="400" class="x-d" font-size="26" fill="#f6eee1" text-anchor="middle">Assistant</text><text x="500" y="428" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">interprets the sentence, keeps every source</text><path d="M500 444C500 480 186 470 186 512" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="182" y="514" width="8" height="52" rx="4" fill="#90c5b8"/><path d="M202 540l4 4.5l8 -9" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="56" y="584" width="260" height="136" rx="12" fill="#1b1813" stroke="#90c5b8" stroke-width="1.5"/><text x="78" y="618" class="x-m" font-size="12" fill="#90c5b8" text-anchor="start">MCP · 1</text><text x="78" y="652" class="x-d" font-size="25" fill="#f6eee1" text-anchor="start">Project tracker</text><rect x="78" y="677" width="144.12" height="26" rx="13.0" fill="#2c4a43"/><text x="150.06" y="696" class="x-m" font-size="13" fill="#d6efe8" text-anchor="middle">READ: BLOCKERS</text><path d="M500 444C500 480 500 470 500 512" fill="none" stroke="#e3a857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="514" width="8" height="52" rx="4" fill="#90c5b8"/><path d="M516 540l4 4.5l8 -9" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="584" width="260" height="136" rx="12" fill="#1b1813" stroke="#e3a857" stroke-width="1.5"/><text x="392" y="618" class="x-m" font-size="12" fill="#e3a857" text-anchor="start">MCP · 2</text><text x="392" y="652" class="x-d" font-size="25" fill="#f6eee1" text-anchor="start">Writing workspace</text><rect x="392" y="677" width="135.54" height="26" rx="13.0" fill="#2c4a43"/><text x="459.77" y="696" class="x-m" font-size="13" fill="#d6efe8" text-anchor="middle">CREATE: DRAFT</text><path d="M500 444C500 480 814 470 814 512" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><rect x="810" y="514" width="8" height="52" rx="4" fill="#e8a18a"/><path d="M831 535l10 10M841 535l-10 10" fill="none" stroke="#e8a18a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="584" width="260" height="136" rx="12" fill="#22160f" stroke="#e8a18a" stroke-width="1.5" stroke-dasharray="5 5"/><text x="706" y="618" class="x-m" font-size="12" fill="#e8a18a" text-anchor="start">MCP · ?</text><text x="706" y="652" class="x-d" font-size="25" fill="#c8beae" text-anchor="start">Team channel</text><rect x="706" y="677" width="152.7" height="26" rx="13.0" fill="#3b211a"/><text x="782.35" y="696" class="x-m" font-size="13" fill="#e8a18a" text-anchor="middle">SEND: NOT ASKED</text><text x="56" y="762" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">Each server checks its own scope. Nothing in the request authorises delivery.</text><rect x="56" y="786" width="888" height="96" rx="12" fill="#1e1a13" stroke="#b98038" stroke-width="1" stroke-dasharray="3 6"/><text x="80" y="820" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">CORRECTION</text><text x="80" y="856" class="x-i" font-size="26" fill="#f6eee1" text-anchor="start">“Use the mobile release, not the web release.”</text><text x="920" y="856" class="x-s" font-size="16" fill="#c8beae" text-anchor="end">replace the selection · revise the draft</text><path d="M56 932L944 932" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="962" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">PROPOSED EXPERIMENT · ILLUSTRATIVE REQUEST · NOT YET RUN</text><text x="56" y="990" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/voice-through-mcp</text></svg>
