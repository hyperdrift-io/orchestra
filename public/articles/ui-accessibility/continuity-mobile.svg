<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1490" viewBox="0 0 600 1490" role="img" aria-labelledby="continuity-m-title continuity-m-desc"><title id="continuity-m-title">Change the input, keep the work</title><desc id="continuity-m-desc">A proposed scenario: a person speaks criteria and gets three grants with evidence, drops one by keyboard, hears the comparison through a screen reader, loses the voice session, then returns later. When the work lives in the conversation, each switch can mean starting again. When it lives in the task, the two remaining grants, the decision and the evidence survive every switch. A design goal, not an observed result.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1490" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 6 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">Change the input.</text><text x="32" y="158.42" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start"><tspan fill="#f4cd92" class="x-i">Keep</tspan> the work.</text><text x="32" y="211.34" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">A grant shortlist through speech, keyboard,</text><text x="32" y="242.14" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">a screen reader and a dropped session.</text><text x="236" y="316" class="x-m" font-size="12" fill="#c8beae" text-anchor="start">WORK LIVES IN</text><text x="236" y="336" class="x-m" font-size="13" fill="#e8a18a" text-anchor="start">THE CONVERSATION</text><path d="M236 428L236 542" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-lin