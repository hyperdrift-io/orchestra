<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="webmcp-title webmcp-desc"><title id="webmcp-title">Stop making agents hunt for buttons</title><desc id="webmcp-desc">Inside the Radar Explore page, a founder clicks Keep while a browser agent calls a tool the page declares through WebMCP: search_items, read_item, propose_founder_profile, suggest_item, set_aside_items, read_workspace or draft_brief. Without declared tools, an agent wanders across the screen guessing which button does what. The button and the tool reach the same shared workspace functions and change the same shortlist. Outside the page, an assistant reaches a service through an MCP server: no open page, a different scope with its own checks.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="1060" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 3 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">Stop making agents <tspan fill="#f4cd92" class="x-i">hunt</tspan> for buttons.</text><text x="56" y="182.58" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">The page says what it can do. You and the agent change the same work.</text><rect x="56" y="214" width="888" height="576" rx="14" fill="#1b1813" stroke="#3a342b" stroke-width="1.5"/><circle cx="78" cy="236" r="5" fill="#3a342b"/><circle cx="94" cy="236" r="5" fill="#3a342b"/><circle cx="110" cy="236" r="5" fill="#3a342b"/><rect x="132" y="224" width="300" height="24" rx="12" fill="#221e18"/><text x="148" y="241" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">radar.hyperdrift.io/explore</text><path d="M56 258L944 258" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="294" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">THE PAGE THE FOUNDER SEES</text><rect x="84" y="312" width="86" height="26" rx="13" fill="#2b261f"/><text x="127" y="330" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">grants</text><rect x="180" y="312" width="86" height="26" rx="13" fill="#2b261f"/><text x="223" y="330" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">deadline</text><rect x="276" y="312" width="86" height="26" rx="13" fill="#2b261f"/><text x="319" y="330" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">source</text><rect x="84" y="358" width="400" height="42" rx="6" fill="#221e18"/><text x="98" y="384.6" class="x-s" font-size="16" fill="#f6eee1" text-anchor="start">Innovate UK smart grant</text><rect x="410" y="367" width="60" height="24" rx="12.0" fill="#e3a857"/><text x="440" y="384" class="x-s" font-size="14" fill="#14120e" text-anchor="middle">Keep</text><rect x="84" y="410" width="400" height="42" rx="6" fill="#221e18"/><text x="98" y="436.6" class="x-s" font-size="16" fill="#f6eee1" text-anchor="start">AI skills fund</text><rect x="410" y="419" width="60" height="24" rx="12.0" fill="none" stroke="#c8beae" stroke-width="1"/><text x="440" y="436" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">Drop</text><rect x="84" y="462" width="400" height="42" rx="6" fill="#221e18"/><text x="98" y="488.6" class="x-s" font-size="16" fill="#f6eee1" text-anchor="start">R&amp;D tax relief guidance</text><rect x="410" y="471" width="60" height="24" rx="12.0" fill="#e3a857"/><text x="440" y="488" class="x-s" font-size="14" fill="#14120e" text-anchor="middle">Keep</text><path d="M546 278L546 618" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><text x="576" y="294" class="x-m" font-size="13" fill="#90c5b8" text-anchor="start">THE PAGE DECLARES · WEBMCP</text><rect x="576" y="312" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="333" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">search_items</text><rect x="576" y="352" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="373" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">read_item</text><rect x="576" y="392" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="413" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">propose_founder_profile</text><rect x="576" y="432" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="453" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">suggest_item</text><rect x="576" y="472" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="493" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">set_aside_items</text><rect x="576" y="512" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="533" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">read_workspace</text><rect x="576" y="552" width="256" height="32" rx="6" fill="#2c4a43"/><text x="590" y="573" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">draft_brief</text><text x="904" y="400" class="x-d" font-size="26" fill="#90c5b8" text-anchor="middle">Agent</text><text x="904" y="423" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">calls by</text><text x="904" y="442" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">name</text><path d="M884 454C878 464 864 464 844 464" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="838,464 846,459.2 846,468.8" fill="#90c5b8"/><path d="M904 374C904 272 844 272 526 272" fill="none" stroke="#e8a18a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M526 272C416 272 416 346 306 346C331 346 331 384 356 384C281 384 281 410 206 410C296 410 296 442 386 442C376 442 376 431 366 431" fill="none" stroke="#e8a18a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="378" cy="431" r="11" fill="#22160f" stroke="#e8a18a" stroke-width="1.5"/><text x="378" y="436" class="x-s" font-size="14" fill="#e8a18a" text-anchor="middle">?</text><polygon points="440.0,499.0 435.2,507.0 444.8,507.0" fill="#f6eee1"/><path d="M440 507L440 513" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="537" class="x-d" font-size="24" fill="#f6eee1" text-anchor="middle">You</text><text x="440" y="556" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">click Keep</text><path d="M84 603c8 -10 14 10 22 0s14 10 22 0" fill="none" stroke="#e8a18a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="140" y="608" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">guessing from the screen</text><path d="M84 631L128 631" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="130,631 123,626.8 123,635.2" fill="#90c5b8"/><text x="140" y="636" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">calling a declared tool</text><path d="M440.0 567.0V704" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="440.0,712 435.2,704 444.8,704" fill="#f6eee1"/><path d="M700 592C700 654 576 654 576 704" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="576,712 571.2,704 580.8,704" fill="#90c5b8"/><rect x="270" y="714" width="460" height="58" rx="10" fill="#2a2112" stroke="#e3a857" stroke-width="1.5"/><text x="500" y="740" class="x-d" font-size="20" fill="#f4cd92" text-anchor="middle">Shared workspace functions</text><text x="500" y="760" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">a button and a tool change the same shortlist</text><rect x="56" y="820" width="888" height="96" rx="14" fill="none" stroke="#8f8576" stroke-width="1.2" stroke-dasharray="6 6"/><text x="80" y="854" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">OUTSIDE THE PAGE · MCP</text><text x="80" y="890" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">Assistant  →  MCP server  →  service</text><text x="920" y="890" class="x-s" font-size="17" fill="#c8beae" text-anchor="end">No open page. A different scope, with its own checks.</text><path d="M56 972L944 972" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="1002" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">RADAR WEBMCP IMPLEMENTATION · TOOL NAMES AS REGISTERED</text><text x="56" y="1030" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">ai.hyperdrift.io/articles/webmcp-actions-on-the-page</text></svg>
