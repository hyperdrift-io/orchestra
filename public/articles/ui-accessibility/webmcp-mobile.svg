<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1510" viewBox="0 0 600 1510" role="img" aria-labelledby="webmcp-m-title webmcp-m-desc"><title id="webmcp-m-title">Stop making agents hunt for buttons</title><desc id="webmcp-m-desc">Inside the Radar Explore page, a founder clicks Keep while a browser agent calls a tool the page declares through WebMCP: search_items, read_item, propose_founder_profile, suggest_item, set_aside_items, read_workspace or draft_brief. Without declared tools, an agent wanders across the screen guessing which button does what. The button and the tool reach the same shared workspace functions and change the same shortlist. Outside the page, an assistant reaches a service through an MCP server: no open page, a different scope with its own checks.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1510" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 3 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">Stop making agents</text><text x="32" y="158.42" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start"><tspan fill="#f4cd92" class="x-i">hunt</tspan> for buttons.</text><text x="32" y="211.34" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">The page says what it can do. You and</text><text x="32" y="242.14" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">the agent change the same work.</text><rect x="24" y="284" width="552" height="900" rx="14" fill="#1b1813" stroke="#3a342b" stroke-width="1.5"/><circle cx="46" cy="306" r="5" fill="#3a342b"/><circle cx="62" cy="306" r="5" fill="#3a342b"/><circle cx="78" cy="306" r="5" fill="#3a342b"/><rect x="100" y="294" width="300" height="24" rx="12" fill="#221e18"/><text x="116" y="311" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">radar.hyperdrift.io/explore</text><path d="M24 328L576 328" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="366" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">THE PAGE THE FOUNDER SEES</text><rect x="48" y="384" width="94" height="26" rx="13" fill="#2b261f"/><text x="95" y="402" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">grants</text><rect x="152" y="384" width="94" height="26" rx="13" fill="#2b261f"/><text x="199" y="402" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">deadline</text><rect x="256" y="384" width="94" height="26" rx="13" fill="#2b261f"/><text x="303" y="402" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">source</text><rect x="48" y="430" width="504" height="48" rx="6" fill="#221e18"/><text x="62" y="459.95" class="x-s" font-size="17" fill="#f6eee1" text-anchor="start">Innovate UK smart grant</text><rect x="466" y="439" width="72" height="30" rx="15.0" fill="#e3a857"/><text x="502" y="459" class="x-s" font-size="15" fill="#14120e" text-anchor="middle">Keep</text><rect x="48" y="488" width="504" height="48" rx="6" fill="#221e18"/><text x="62" y="517.95" class="x-s" font-size="17" fill="#f6eee1" text-anchor="start">AI skills fund</text><rect x="466" y="497" width="72" height="30" rx="15.0" fill="none" stroke="#c8beae" stroke-width="1"/><text x="502" y="517" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">Drop</text><rect x="48" y="546" width="504" height="48" rx="6" fill="#221e18"/><text x="62" y="575.95" class="x-s" font-size="17" fill="#f6eee1" text-anchor="start">R&amp;D tax relief guidance</text><rect x="466" y="555" width="72" height="30" rx="15.0" fill="#e3a857"/><text x="502" y="575" class="x-s" font-size="15" fill="#14120e" text-anchor="middle">Keep</text><polygon points="502.0,589.0 497.2,597.0 506.8,597.0" fill="#f6eee1"/><path d="M502 597L502 607" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="502" y="635" class="x-d" font-size="24" fill="#f6eee1" text-anchor="middle">You</text><text x="502" y="655" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">click Keep</text><path d="M48 683c8 -10 14 10 22 0s14 10 22 0" fill="none" stroke="#e8a18a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="104" y="688" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">guessing from the screen</text><path d="M48 711L92 711" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="94,711 87,706.8 87,715.2" fill="#90c5b8"/><text x="104" y="716" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">calling a declared tool</text><text x="48" y="756" class="x-m" font-size="13" fill="#90c5b8" text-anchor="start">THE PAGE DECLARES · WEBMCP</text><rect x="48" y="776" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="797" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">search_items</text><rect x="48" y="816" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="837" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">read_item</text><rect x="48" y="856" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="877" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">propose_founder_profile</text><rect x="48" y="896" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="917" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">suggest_item</text><rect x="48" y="936" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="957" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">set_aside_items</text><rect x="48" y="976" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="997" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">read_workspace</text><rect x="48" y="1016" width="300" height="32" rx="6" fill="#2c4a43"/><text x="62" y="1037" class="x-m" font-size="15" fill="#d6efe8" text-anchor="start">draft_brief</text><text x="384" y="888" class="x-d" font-size="26" fill="#90c5b8" text-anchor="start">Agent</text><text x="384" y="914" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">calls a tool</text><text x="384" y="933.8" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">by name</text><path d="M380 904C366 904 366 912 358 912" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="354,912 362,907.2 362,916.8" fill="#90c5b8"/><path d="M502 667L502 1084" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="502.0,1092 497.2,1084 506.8,1084" fill="#f6eee1"/><path d="M198 1050L198 1084" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="198,1092 193.2,1084 202.8,1084" fill="#90c5b8"/><rect x="48" y="1096" width="504" height="64" rx="10" fill="#2a2112" stroke="#e3a857" stroke-width="1.5"/><text x="300" y="1125" class="x-d" font-size="21" fill="#f4cd92" text-anchor="middle">Shared workspace functions</text><text x="300" y="1147" class="x-s" font-size="14" fill="#c8beae" text-anchor="middle">a button and a tool change the same shortlist</text><rect x="24" y="1214" width="552" height="150" rx="14" fill="none" stroke="#8f8576" stroke-width="1.2" stroke-dasharray="6 6"/><text x="48" y="1248" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">OUTSIDE THE PAGE · MCP</text><text x="48" y="1288" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">Assistant → MCP server → service</text><text x="48" y="1322" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">No open page. A different scope,</text><text x="48" y="1344.44" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">with its own checks.</text><path d="M32 1418L568 1418" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1448" class="x-m" font-size="14" fill="#c8beae" text-anchor="start">RADAR WEBMCP IMPLEMENTATION · TOOL NAMES AS REGISTERED</text><text x="32" y="1476" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/webmcp-actions-on-the-page</text></svg>
