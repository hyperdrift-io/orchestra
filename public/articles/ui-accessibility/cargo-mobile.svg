<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1390" viewBox="0 0 600 1390" role="img" aria-labelledby="cargo-m-title cargo-m-desc"><title id="cargo-m-title">A spoken promise is not a completed action</title><desc id="cargo-m-desc">From the recorded Cargo sandbox take. The captain says “Cargo.” The First Officer reports it stopped answering a minute ago and offers options. The captain says “Bring it back.” The officer accepts the order while the service is still recovering, probes Cargo from outside, and only after it answers twice replies: “Captain, Cargo answers again. Checked twice, 75 milliseconds.” Sequence, not to scale.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1390" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 4 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">A spoken promise is <tspan fill="#f4cd92" class="x-i">not</tspan></text><text x="32" y="158.42" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">a completed action.</text><text x="32" y="211.34" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">First Officer reports recovery only</text><text x="32" y="242.14" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">after Cargo answers twice.</text><text x="32" y="300" class="x-m" font-size="12" fill="#c8beae" text-anchor="start">CAPTAIN</text><text x="150" y="300" class="x-m" font-size="12" fill="#e3a857" text-anchor="start">FIRST OFFICER</text><text x="556" y="300" class="x-m" font-size="12" fill="#90c5b8" text-anchor="middle">CARGO</text><rect x="550" y="320" width="12" height="426" rx="6" fill="#3b211a"/><rect x="550" y="746" width="12" height="234" rx="6" fill="#2c2a20"/><rect x="550" y="980" width="12" height="240" rx="6" fill="#90c5b8"/><text x="538" y="350" class="x-s" font-size="14" fill="#e8a18a" text-anchor="end">down</text><text x="538" y="776" class="x-s" font-size="14" fill="#c8beae" text-anchor="end">recovering</text><text x="538" y="1210" class="x-s" font-size="14" fill="#90c5b8" text-anchor="end">answering</text><rect x="32" y="320" width="120" height="46.3" rx="12" fill="#221e18" stroke="#c8beae" stroke-width="1"/><text x="46" y="349" class="x-s" font-size="18" fill="#f6eee1" text-anchor="start">“Cargo.”</text><rect x="110" y="386" width="400" height="94.9" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="124" y="415" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">“Cargo stopped answering 1 minute</text><text x="124" y="439.3" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">ago. Bring it online, park it,</text><text x="124" y="463.6" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">or hear why?”</text><rect x="32" y="526" width="190" height="46.3" rx="12" fill="#221e18" stroke="#c8beae" stroke-width="1"/><text x="46" y="555" class="x-s" font-size="18" fill="#f6eee1" text-anchor="start">“Bring it back.”</text><rect x="110" y="592" width="330" height="70.6" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="124" y="621" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">“On it. Helm is bringing</text><text x="124" y="645.3" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">Cargo back online.”</text><rect x="110" y="705" width="144.12" height="26" rx="13.0" fill="#e3a857"/><text x="182.06" y="724" class="x-m" font-size="13" fill="#14120e" text-anchor="middle">ORDER ACCEPTED</text><path d="M92 746L92 1040" fill="none" stroke="#e3a857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><text x="110" y="792" class="x-s" font-size="19" fill="#c8beae" text-anchor="start">A reply here would only mean</text><text x="110" y="817.08" class="x-s" font-size="19" fill="#c8beae" text-anchor="start">the order was received.</text><text x="110" y="880" class="x-s" font-size="19" fill="#f4cd92" text-anchor="start">The officer waits for</text><text x="110" y="905.08" class="x-s" font-size="19" fill="#f4cd92" text-anchor="start">evidence instead.</text><path d="M170 1000L542 1000" fill="none" stroke="#90c5b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><polygon points="546,1000 538,995.2 538,1004.8" fill="#90c5b8"/><circle cx="150" cy="1000" r="14" fill="#2c4a43"/><path d="M144.6 1000l3.6 4.05l7.2 -8.1" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="990" class="x-s" font-size="15" fill="#90c5b8" text-anchor="start">probe 1: answers</text><path d="M170 1056L542 1056" fill="none" stroke="#90c5b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><polygon points="546,1056 538,1051.2 538,1060.8" fill="#90c5b8"/><circle cx="150" cy="1056" r="14" fill="#2c4a43"/><path d="M144.6 1056l3.6 4.05l7.2 -8.1" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="1046" class="x-s" font-size="15" fill="#90c5b8" text-anchor="start">probe 2: answers</text><rect x="110" y="1092" width="420" height="70.6" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="124" y="1121" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">“Captain, Cargo answers again.</text><text x="124" y="1145.3" class="x-s" font-size="18" fill="#f4cd92" text-anchor="start">Checked twice, 75 milliseconds.”</text><rect x="110" y="1191" width="152.7" height="26" rx="13.0" fill="#90c5b8"/><text x="186.35" y="1210" class="x-m" font-size="13" fill="#14120e" text-anchor="middle">RESULT VERIFIED</text><path d="M32 1298L568 1298" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1328" class="x-m" font-size="14" fill="#c8beae" text-anchor="start">RECORDED CARGO TAKE · SANDBOX · SEQUENCE NOT TO SCALE</text><text x="32" y="1356" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">ai.hyperdrift.io/articles/hands-free-app-control</text></svg>
