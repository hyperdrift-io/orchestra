<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="routes-title routes-desc"><title id="routes-title">Who does the work?</title><desc id="routes-desc">One job in five stages — want, find, do, check, fix — across five ways to direct an app. With direct controls the person carries every stage. With an API or CLI a program runs the steps the person defines. With WebMCP, voice over an app and the proposed voice through MCP, the app or agent finds and does the steps; checking happens in a view the person shares, and fixing stays with the person. Voice through MCP forks across two apps. Conceptual: who carries each stage, not how fast. The routes coexist.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="1060" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 1 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">Who does the <tspan fill="#f4cd92" class="x-i">work</tspan>?</text><text x="56" y="182.58" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">One job, five ways to direct an app.</text><rect x="694" y="222" width="266" height="662" rx="10" fill="#1e1a13" stroke="#b98038" stroke-width="1" stroke-dasharray="3 6"/><text x="372" y="246" class="x-m" font-size="12" fill="#8f8576" text-anchor="middle">01</text><text x="372" y="270" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">WANT</text><text x="486" y="246" class="x-m" font-size="12" fill="#8f8576" text-anchor="middle">02</text><text x="486" y="270" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">FIND</text><text x="600" y="246" class="x-m" font-size="12" fill="#8f8576" text-anchor="middle">03</text><text x="600" y="270" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">DO</text><text x="772" y="246" class="x-m" font-size="12" fill="#8f8576" text-anchor="middle">04</text><text x="772" y="270" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">CHECK</text><text x="886" y="246" class="x-m" font-size="12" fill="#8f8576" text-anchor="middle">05</text><text x="886" y="270" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">FIX</text><g data-route="controls"><text x="56" y="324" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">Direct controls</text><text x="56" y="349" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">You operate every step</text><path d="M350 312L908 312" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M350 368L908 368" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M372 312C429 312 429 312 486 312C543 312 543 312 600 312C686 312 686 312 772 312C829 312 829 312 886 312" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="312" r="10" fill="#f6eee1"/><circle cx="486" cy="312" r="10" fill="#f6eee1"/><circle cx="600" cy="312" r="10" fill="#f6eee1"/><circle cx="772" cy="312" r="10" fill="#f6eee1"/><circle cx="886" cy="312" r="10" fill="#f6eee1"/></g><g data-route="api-cli"><text x="56" y="430" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">API / CLI</text><text x="56" y="455" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">A program runs the steps you define</text><path d="M350 418L908 418" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M350 474L908 474" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M372 418C429 418 429 418 486 418C543 418 543 474 600 474C686 474 686 418 772 418C829 418 829 418 886 418" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="418" r="10" fill="#f6eee1"/><circle cx="486" cy="418" r="10" fill="#f6eee1"/><circle cx="600" cy="474" r="10" fill="#90c5b8"/><circle cx="772" cy="418" r="10" fill="#f6eee1"/><circle cx="886" cy="418" r="10" fill="#f6eee1"/><text x="600" y="498" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">script runs</text></g><g data-route="webmcp"><text x="56" y="536" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">WebMCP</text><text x="56" y="561" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">The page declares its own tools</text><path d="M350 524L908 524" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M350 580L908 580" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M372 524C429 524 429 580 486 580C543 580 543 580 600 580C686 580 686 552 772 552C829 552 829 524 886 524" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="524" r="10" fill="#f6eee1"/><circle cx="486" cy="580" r="10" fill="#90c5b8"/><circle cx="600" cy="580" r="10" fill="#90c5b8"/><circle cx="772" cy="552" r="10" fill="#90c5b8"/><path d="M772 542A10 10 0 0 0 772 562Z" fill="#f6eee1"/><circle cx="886" cy="524" r="10" fill="#f6eee1"/><text x="486" y="604" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">page tool</text><text x="772" y="576" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">shared page</text></g><g data-route="voice-app"><text x="56" y="642" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">Voice over an app</text><text x="56" y="667" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">Speech starts the work</text><path d="M350 630L908 630" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M350 686L908 686" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M372 630C429 630 429 686 486 686C543 686 543 686 600 686C686 686 686 658 772 658C829 658 829 630 886 630" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="630" r="10" fill="#f6eee1"/><circle cx="486" cy="686" r="10" fill="#90c5b8"/><circle cx="600" cy="686" r="10" fill="#90c5b8"/><circle cx="772" cy="658" r="10" fill="#90c5b8"/><path d="M772 648A10 10 0 0 0 772 668Z" fill="#f6eee1"/><circle cx="886" cy="630" r="10" fill="#f6eee1"/><text x="600" y="710" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">app acts</text><text x="772" y="682" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">checked twice</text></g><g data-route="voice-mcp"><text x="56" y="748" class="x-d" font-size="27" fill="#f4cd92" text-anchor="start">Voice through MCP</text><text x="56" y="773" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">Proposed: one sentence, many apps</text><path d="M350 736L908 736" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M350 792L908 792" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M372 736C429 736 429 792 486 792C543 792 543 780 600 780C686 780 686 764 772 764C829 764 829 736 886 736" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><path d="M486 792C543 792 543 804 600 804C686 804 686 764 772 764" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><circle cx="372" cy="736" r="10" fill="#f6eee1"/><circle cx="486" cy="792" r="10" fill="#90c5b8"/><circle cx="600" cy="780" r="8" fill="#90c5b8"/><circle cx="600" cy="804" r="8" fill="#90c5b8"/><circle cx="772" cy="764" r="10" fill="#90c5b8"/><path d="M772 754A10 10 0 0 0 772 774Z" fill="#f6eee1"/><circle cx="886" cy="736" r="10" fill="#f6eee1"/><text x="600" y="830" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">two apps</text><text x="772" y="788" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">with sources</text></g><path d="M464 840V848H622V840" fill="none" stroke="#90c5b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="543" y="870" class="x-m" font-size="13" fill="#90c5b8" text-anchor="middle">THE STEPS MOVE</text><text x="827" y="870" class="x-m" font-size="13" fill="#e3a857" text-anchor="middle">JUDGEMENT STAYS WITH YOU</text><circle cx="64" cy="245" r="7" fill="#f6eee1"/><text x="78" y="250" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">You</text><circle cx="128" cy="245" r="7" fill="#90c5b8"/><text x="142" y="250" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">App, program or agent</text><circle cx="64" cy="271" r="7" fill="#90c5b8"/><path d="M64 264A7 7 0 0 0 64 278Z" fill="#f6eee1"/><text x="78" y="276" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">Shared view</text><text x="56" y="942" class="x-d" font-size="36" fill="#f6eee1" text-anchor="start">The steps move. The judgement stays with <tspan fill="#f4cd92" class="x-i">you</tspan>.</text><path d="M56 972L944 972" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="1002" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">CONCEPTUAL · WHO, NOT HOW FAST · ROUTES COEXIST</text><text x="56" y="1030" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/is-ui-holding-us-back</text></svg>
