<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="cargo-title cargo-desc"><title id="cargo-title">A spoken promise is not a completed action</title><desc id="cargo-desc">From the recorded Cargo sandbox take. The captain says “Cargo.” The First Officer reports it stopped answering a minute ago and offers options. The captain says “Bring it back.” The officer accepts the order while the service is still recovering, probes Cargo from outside, and only after it answers twice replies: “Captain, Cargo answers again. Checked twice, 75 milliseconds.” Sequence, not to scale.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="1000" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 4 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">A spoken promise is <tspan fill="#f4cd92" class="x-i">not</tspan></text><text x="56" y="176.58" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">a completed action.</text><text x="56" y="237.66" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">First Officer reports recovery only after Cargo answers twice.</text><text x="56" y="335" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">CAPTAIN</text><path d="M200 330L944 330" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><text x="56" y="505" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">FIRST OFFICER</text><path d="M200 500L944 500" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><text x="56" y="685" class="x-m" font-size="13" fill="#90c5b8" text-anchor="start">CARGO SANDBOX</text><path d="M200 680L944 680" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><rect x="200" y="664" width="356" height="32" rx="16" fill="#3b211a"/><text x="214" y="685" class="x-s" font-size="15" fill="#e8a18a" text-anchor="start">not answering</text><rect x="556" y="664" width="222" height="32" rx="16" fill="#2c2a20"/><text x="570" y="685" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">recovering</text><rect x="778" y="664" width="166" height="32" rx="16" fill="#2c4a43"/><text x="792" y="685" class="x-s" font-size="15" fill="#d6efe8" text-anchor="start">answering</text><rect x="200" y="307" width="104" height="43.6" rx="12" fill="#221e18" stroke="#c8beae" stroke-width="1"/><text x="214" y="334" class="x-s" font-size="16" fill="#f6eee1" text-anchor="start">“Cargo.”</text><rect x="230" y="457" width="312" height="86.8" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="244" y="484" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">“Cargo stopped answering 1 minute</text><text x="244" y="505.6" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">ago. Bring it online, park it,</text><text x="244" y="527.2" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">or hear why?”</text><rect x="430" y="307" width="150" height="43.6" rx="12" fill="#221e18" stroke="#c8beae" stroke-width="1"/><text x="444" y="334" class="x-s" font-size="16" fill="#f6eee1" text-anchor="start">“Bring it back.”</text><rect x="556" y="468" width="232" height="65.2" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="570" y="495" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">“On it. Helm is bringing</text><text x="570" y="516.6" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">Cargo back online.”</text><rect x="556" y="543" width="144.12" height="26" rx="13.0" fill="#e3a857"/><text x="628.06" y="562" class="x-m" font-size="13" fill="#14120e" text-anchor="middle">ORDER ACCEPTED</text><path d="M663 572L663 656" fill="none" stroke="#e3a857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="663,662 658.2,654 667.8,654" fill="#e3a857"/><path d="M818 662L818 446" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><polygon points="818,440 813.2,448 822.8,448" fill="#90c5b8"/><circle cx="818" cy="590" r="14" fill="#2c4a43"/><path d="M812.6 590l3.6 4.05l7.2 -8.1" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 662L878 446" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><polygon points="878,440 873.2,448 882.8,448" fill="#90c5b8"/><circle cx="878" cy="590" r="14" fill="#2c4a43"/><path d="M872.6 590l3.6 4.05l7.2 -8.1" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="798" y="596" class="x-s" font-size="15" fill="#90c5b8" text-anchor="end">2 probes</text><rect x="644" y="370" width="300" height="65.2" rx="12" fill="#2a2112" stroke="#b98038" stroke-width="1"/><text x="658" y="397" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">“Captain, Cargo answers again.</text><text x="658" y="418.6" class="x-s" font-size="16" fill="#f4cd92" text-anchor="start">Checked twice, 75 milliseconds.”</text><rect x="791.3" y="337" width="152.7" height="26" rx="13.0" fill="#90c5b8"/><text x="867.65" y="356" class="x-m" font-size="13" fill="#14120e" text-anchor="middle">RESULT VERIFIED</text><path d="M663 710V726H930V710" fill="none" stroke="#e3a857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="796" y="752" class="x-s" font-size="17" fill="#f4cd92" text-anchor="middle">the officer waits for evidence</text><text x="56" y="836" class="x-d" font-size="30" fill="#f6eee1" text-anchor="start">An accepted order is not a recovered service.</text><text x="56" y="872" class="x-i" font-size="30" fill="#f4cd92" text-anchor="start">The reply waits until Cargo has answered twice.</text><path d="M56 912L944 912" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="942" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">RECORDED CARGO TAKE · SANDBOX · SEQUENCE NOT TO SCALE</text><text x="56" y="970" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/hands-free-app-control</text></svg>
