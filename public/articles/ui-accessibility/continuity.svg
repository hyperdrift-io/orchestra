<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="continuity-title continuity-desc"><title id="continuity-title">Change the input, keep the work</title><desc id="continuity-desc">A proposed scenario: a person speaks criteria and gets three grants with evidence, drops one by keyboard, hears the comparison through a screen reader, loses the voice session, then returns later. When the work lives in the conversation, each switch can mean starting again. When it lives in the task, the two remaining grants, the decision and the evidence survive every switch. A design goal, not an observed result.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="900" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 6 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">Change the input. <tspan fill="#f4cd92" class="x-i">Keep</tspan> the work.</text><text x="56" y="182.58" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">A grant shortlist through speech, keyboard, a screen reader and a dropped session.</text><text x="56" y="258" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">INPUT</text><rect x="222" y="228" width="140" height="46" rx="23" fill="#221e18"/><text x="292" y="257" class="x-s" font-size="16" fill="#f6eee1" text-anchor="middle">Speak</text><text x="292" y="298" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">three grants</text><rect x="368" y="228" width="140" height="46" rx="23" fill="#221e18"/><text x="438" y="257" class="x-s" font-size="16" fill="#f6eee1" text-anchor="middle">Keyboard</text><text x="438" y="298" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">drop one</text><rect x="514" y="228" width="140" height="46" rx="23" fill="#221e18"/><text x="584" y="257" class="x-s" font-size="16" fill="#f6eee1" text-anchor="middle">Screen reader</text><text x="584" y="298" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">hear the comparison</text><rect x="660" y="228" width="140" height="46" rx="23" fill="#3b211a" stroke="#e8a18a" stroke-width="1"/><text x="730" y="257" class="x-s" font-size="16" fill="#e8a18a" text-anchor="middle">Session drops</text><rect x="806" y="228" width="140" height="46" rx="23" fill="#221e18"/><text x="876" y="257" class="x-s" font-size="16" fill="#f6eee1" text-anchor="middle">Return later</text><text x="876" y="298" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">same shortlist</text><rect x="40" y="332" width="920" height="140" rx="12" fill="#1b1813" stroke="#3a342b" stroke-width="1"/><text x="56" y="366" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">WORK LIVES IN</text><text x="56" y="387" class="x-m" font-size="14" fill="#e8a18a" text-anchor="start">THE CONVERSATION</text><path d="M332 444L398 444" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><path d="M361 440l8 8M369 440l-8 8" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M478 444L544 444" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><path d="M507 440l8 8M515 440l-8 8" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M624 444L690 444" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><path d="M653 440l8 8M661 440l-8 8" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M770 444L836 444" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/><path d="M799 440l8 8M807 440l-8 8" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="364" width="13" height="18" rx="2" fill="#e3a857"/><rect x="286" y="364" width="13" height="18" rx="2" fill="#e3a857"/><rect x="304" y="364" width="13" height="18" rx="2" fill="#e3a857"/><circle cx="274" cy="414" r="4.5" fill="#90c5b8"/><circle cx="292" cy="414" r="4.5" fill="#90c5b8"/><circle cx="310" cy="414" r="4.5" fill="#90c5b8"/><text x="438" y="400" class="x-s" font-size="16" fill="#e8a18a" text-anchor="middle">start again</text><text x="584" y="400" class="x-s" font-size="16" fill="#e8a18a" text-anchor="middle">start again</text><text x="730" y="400" class="x-s" font-size="16" fill="#e8a18a" text-anchor="middle">start again</text><text x="876" y="400" class="x-s" font-size="16" fill="#e8a18a" text-anchor="middle">start again</text><rect x="40" y="502" width="920" height="140" rx="12" fill="#1e1a13" stroke="#b98038" stroke-width="1"/><text x="56" y="536" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">WORK LIVES IN</text><text x="56" y="557" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">THE TASK</text><path d="M252 614L926 614" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="268" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="286" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="304" y="534" width="13" height="18" rx="2" fill="#e3a857"/><circle cx="274" cy="584" r="4.5" fill="#90c5b8"/><circle cx="292" cy="584" r="4.5" fill="#90c5b8"/><circle cx="310" cy="584" r="4.5" fill="#90c5b8"/><rect x="414" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="432" y="534" width="13" height="18" rx="2" fill="#e3a857"/><path d="M415.2 566l3.2 3.6l6.4 -7.2" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="584" r="4.5" fill="#90c5b8"/><circle cx="438" cy="584" r="4.5" fill="#90c5b8"/><rect x="560" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="578" y="534" width="13" height="18" rx="2" fill="#e3a857"/><path d="M561.2 566l3.2 3.6l6.4 -7.2" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="566" cy="584" r="4.5" fill="#90c5b8"/><circle cx="584" cy="584" r="4.5" fill="#90c5b8"/><rect x="706" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="724" y="534" width="13" height="18" rx="2" fill="#e3a857"/><path d="M707.2 566l3.2 3.6l6.4 -7.2" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="712" cy="584" r="4.5" fill="#90c5b8"/><circle cx="730" cy="584" r="4.5" fill="#90c5b8"/><rect x="852" y="534" width="13" height="18" rx="2" fill="#e3a857"/><rect x="870" y="534" width="13" height="18" rx="2" fill="#e3a857"/><path d="M853.2 566l3.2 3.6l6.4 -7.2" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="858" cy="584" r="4.5" fill="#90c5b8"/><circle cx="876" cy="584" r="4.5" fill="#90c5b8"/><text x="56" y="744" class="x-d" font-size="32" fill="#f6eee1" text-anchor="start">Changing how you work should not mean <tspan fill="#f4cd92" class="x-i">starting again</tspan>.</text><rect x="56" y="772" width="12" height="16" rx="2" fill="#e3a857"/><text x="76" y="786" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">grant on the shortlist</text><path d="M273.2 780l3.2 3.6l6.4 -7.2" fill="none" stroke="#f6eee1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="294" y="786" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">your decision</text><circle cx="422" cy="780" r="4.5" fill="#90c5b8"/><text x="434" y="786" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">its evidence</text><path d="M56 812L944 812" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="842" class="x-m" font-size="13" fill="#c8beae" text-anchor="start">DESIGN GOAL · PROPOSED SCENARIO · NOT AN OBSERVED RESULT</text><text x="56" y="870" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/future-ui-keep-your-place</text></svg>
