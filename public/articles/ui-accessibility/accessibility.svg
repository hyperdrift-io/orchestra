<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" role="img" aria-labelledby="access-title access-desc"><title id="access-title">The scan checks the front door</title><desc id="access-desc">WebAIM detected WCAG failures on 95.9% of one million home pages in February 2026, with 56.1 detected errors per page on average. Each square is one percentage point; the 96th is 90% filled. The remaining 4.1% had no detected failures, which is unknown rather than accessible. A home-page scan covers the first stop of an illustrative booking journey; finding a date, comparing places, checking an access need, fixing details and saving the booking are not measured by it.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="1000" height="990" fill="#14120e"/><text x="56" y="54" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">PART 2 OF 6 · UI &amp; ACCESSIBILITY</text><text x="56" y="121.5" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">The scan checks the <tspan fill="#f4cd92" class="x-i">front door</tspan>.</text><text x="56" y="182.58" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">People need the whole journey to work.</text><text x="56" y="312" class="x-d" font-size="120" fill="#e3a857" text-anchor="start">95.9%</text><text x="60" y="392" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">of one million home pages had</text><text x="60" y="419.72" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">detected WCAG failures</text><text x="56" y="512" class="x-d" font-size="60" fill="#f6eee1" text-anchor="start">56.1</text><text x="186" y="490" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">detected 