<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1500" viewBox="0 0 600 1500" role="img" aria-labelledby="routes-m-title routes-m-desc"><title id="routes-m-title">Who does the work?</title><desc id="routes-m-desc">One job in five stages — want, find, do, check, fix — across five ways to direct an app. With direct controls the person carries every stage. With an API or CLI a program runs the steps the person defines. With WebMCP, voice over an app and the proposed voice through MCP, the app or agent finds and does the steps; checking happens in a view the person shares, and fixing stays with the person. Voice through MCP forks across two apps. Conceptual: who carries each stage, not how fast. The routes coexist.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1500" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 1 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">Who does the <tspan fill="#f4cd92" class="x-i">work</tspan>?</text><text x="32" y="164.42" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">One job, five ways to direct</text><text x="32" y="195.22" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">an app.</text><rect x="375.5" y="228" width="204.5" height="998" rx="10" fill="#1e1a13" stroke="#b98038" stroke-width="1" stroke-dasharray="3 6"/><text x="80" y="252" class="x-m" font-size="13" fill="#8f8576" text-anchor="middle">01</text><text x="80" y="276" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">WANT</text><text x="195" y="252" class="x-m" font-size="13" fill="#8f8576" text-anchor="middle">02</text><text x="195" y="276" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">FIND</text><text x="310" y="252" class="x-m" font-size="13" fill="#8f8576" text-anchor="middle">03</text><text x="310" y="276" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">DO</text><text x="425" y="252" class="x-m" font-size="13" fill="#8f8576" text-anchor="middle">04</text><text x="425" y="276" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">CHECK</text><text x="540" y="252" class="x-m" font-size="13" fill="#8f8576" text-anchor="middle">05</text><text x="540" y="276" class="x-m" font-size="16" fill="#f6eee1" text-anchor="middle">FIX</text><g data-route="controls"><text x="32" y="330" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">Direct controls</text><text x="32" y="352" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">You operate every step</text><path d="M58 386L562 386" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M58 444L562 444" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M80 386C137.5 386 137.5 386 195 386C252.5 386 252.5 386 310 386C367.5 386 367.5 386 425 386C482.5 386 482.5 386 540 386" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="80" cy="386" r="10" fill="#f6eee1"/><circle cx="195" cy="386" r="10" fill="#f6eee1"/><circle cx="310" cy="386" r="10" fill="#f6eee1"/><circle cx="425" cy="386" r="10" fill="#f6eee1"/><circle cx="540" cy="386" r="10" fill="#f6eee1"/></g><g data-route="api-cli"><text x="32" y="505" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">API / CLI</text><text x="32" y="527" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">A program runs the steps you define</text><path d="M58 561L562 561" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M58 619L562 619" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M80 561C137.5 561 137.5 561 195 561C252.5 561 252.5 619 310 619C367.5 619 367.5 561 425 561C482.5 561 482.5 561 540 561" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="80" cy="561" r="10" fill="#f6eee1"/><circle cx="195" cy="561" r="10" fill="#f6eee1"/><circle cx="310" cy="619" r="10" fill="#90c5b8"/><circle cx="425" cy="561" r="10" fill="#f6eee1"/><circle cx="540" cy="561" r="10" fill="#f6eee1"/><text x="310" y="643" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">script runs</text></g><g data-route="webmcp"><text x="32" y="680" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">WebMCP</text><text x="32" y="702" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">The page declares its own tools</text><path d="M58 736L562 736" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M58 794L562 794" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M80 736C137.5 736 137.5 794 195 794C252.5 794 252.5 794 310 794C367.5 794 367.5 765 425 765C482.5 765 482.5 736 540 736" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="80" cy="736" r="10" fill="#f6eee1"/><circle cx="195" cy="794" r="10" fill="#90c5b8"/><circle cx="310" cy="794" r="10" fill="#90c5b8"/><circle cx="425" cy="765" r="10" fill="#90c5b8"/><path d="M425 755A10 10 0 0 0 425 775Z" fill="#f6eee1"/><circle cx="540" cy="736" r="10" fill="#f6eee1"/><text x="195" y="818" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">page tool</text><text x="425" y="789" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">shared page</text></g><g data-route="voice-app"><text x="32" y="855" class="x-d" font-size="27" fill="#f6eee1" text-anchor="start">Voice over an app</text><text x="32" y="877" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">Speech starts the work</text><path d="M58 911L562 911" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M58 969L562 969" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><g data-trace=""><path pathLength="1" d="M80 911C137.5 911 137.5 969 195 969C252.5 969 252.5 969 310 969C367.5 969 367.5 940 425 940C482.5 940 482.5 911 540 911" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="80" cy="911" r="10" fill="#f6eee1"/><circle cx="195" cy="969" r="10" fill="#90c5b8"/><circle cx="310" cy="969" r="10" fill="#90c5b8"/><circle cx="425" cy="940" r="10" fill="#90c5b8"/><path d="M425 930A10 10 0 0 0 425 950Z" fill="#f6eee1"/><circle cx="540" cy="911" r="10" fill="#f6eee1"/><text x="310" y="993" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">app acts</text><text x="425" y="964" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">checked twice</text></g><g data-route="voice-mcp"><text x="32" y="1030" class="x-d" font-size="27" fill="#f4cd92" text-anchor="start">Voice through MCP</text><text x="32" y="1052" class="x-s" font-size="15" fill="#c8beae" text-anchor="start">Proposed: one sentence, many apps</text><path d="M58 1086L562 1086" fill="none" stroke="#2f2a22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M58 1144L562 1144" fill="none" stroke="#2c4a43" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M80 1086C137.5 1086 137.5 1144 195 1144C252.5 1144 252.5 1131 310 1131C367.5 1131 367.5 1115 425 1115C482.5 1115 482.5 1086 540 1086" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><path d="M195 1144C252.5 1144 252.5 1157 310 1157C367.5 1157 367.5 1115 425 1115" fill="none" stroke="#e3a857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><circle cx="80" cy="1086" r="10" fill="#f6eee1"/><circle cx="195" cy="1144" r="10" fill="#90c5b8"/><circle cx="310" cy="1131" r="8" fill="#90c5b8"/><circle cx="310" cy="1157" r="8" fill="#90c5b8"/><circle cx="425" cy="1115" r="10" fill="#90c5b8"/><path d="M425 1105A10 10 0 0 0 425 1125Z" fill="#f6eee1"/><circle cx="540" cy="1086" r="10" fill="#f6eee1"/><text x="310" y="1183" class="x-s" font-size="15" fill="#90c5b8" text-anchor="middle">two apps</text><text x="425" y="1139" class="x-s" font-size="15" fill="#c8beae" text-anchor="middle">with sources</text></g><path d="M173 1182V1190H332V1182" fill="none" stroke="#90c5b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="252.5" y="1212" class="x-m" font-size="13" fill="#90c5b8" text-anchor="middle">THE STEPS MOVE</text><text x="477.75" y="1212" class="x-m" font-size="13" fill="#e3a857" text-anchor="middle">JUDGEMENT</text><circle cx="40" cy="1271" r="8" fill="#f6eee1"/><text x="56" y="1276" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">You</text><circle cx="122" cy="1271" r="8" fill="#90c5b8"/><text x="138" y="1276" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">App, program or agent</text><circle cx="352" cy="1271" r="8" fill="#90c5b8"/><path d="M352 1263A8 8 0 0 0 352 1279Z" fill="#f6eee1"/><text x="368" y="1276" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">Shared view</text><text x="32" y="1340" class="x-d" font-size="34" fill="#f6eee1" text-anchor="start">The steps move.</text><text x="32" y="1380" class="x-d" font-size="34" fill="#f6eee1" text-anchor="start">The judgement stays with <tspan fill="#f4cd92" class="x-i">you</tspan>.</text><path d="M32 1408L568 1408" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1438" class="x-m" font-size="14" fill="#c8beae" text-anchor="start">CONCEPTUAL · WHO, NOT HOW FAST · ROUTES COEXIST</text><text x="32" y="1466" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">ai.hyperdrift.io/articles/is-ui-holding-us-back</text></svg>
