<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1570" viewBox="0 0 600 1570" role="img" aria-labelledby="access-m-title access-m-desc"><title id="access-m-title">The scan checks the front door</title><desc id="access-m-desc">WebAIM detected WCAG failures on 95.9% of one million home pages in February 2026, with 56.1 detected errors per page on average. Each square is one percentage point; the 96th is 90% filled. The remaining 4.1% had no detected failures, which is unknown rather than accessible. A home-page scan covers the first stop of an illustrative booking journey; finding a date, comparing places, checking an access need, fixing details and saving the booking are not measured by it.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1570" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 2 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">The scan checks</text><text x="32" y="158.42" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">the <tspan fill="#f4cd92" class="x-i">front door</tspan>.</text><text x="32" y="211.34" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">People need the whole journey to work.</text><text x="32" y="330" class="x-d" font-size="104" fill="#e3a857" text-anchor="start">95.9%</text><text x="32" y="400" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">of one million home pages had</text><text x="32" y="427.72" class="x-s" font-size="21" fill="#f6eee1" text-anchor="start">detected WCAG failures</text><text x="32" y="516" class="x-d" font-size="54" fill="#f6eee1" text-anchor="start">56.1</text><text x="150" y="494" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">detected errors per</text><text x="150" y="517.76" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">home page, on average</text><rect x="70" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="352" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="560" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="352" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="607" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="654" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="654" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="654" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="654" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="654" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="654" width="38" height="38" rx="3" fill="#e3a857"/><re