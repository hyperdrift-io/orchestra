eight="38" rx="3" fill="#e3a857"/><rect x="352" y="795" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="795" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="795" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="795" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="352" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="842" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="352" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="889" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="352" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="399" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="446" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="493" y="936" width="38" height="38" rx="3" fill="#e3a857"/><rect x="70" y="983" width="38" height="38" rx="3" fill="#e3a857"/><rect x="117" y="983" width="38" height="38" rx="3" fill="#e3a857"/><rect x="164" y="983" width="38" height="38" rx="3" fill="#e3a857"/><rect x="211" y="983" width="38" height="38" rx="3" fill="#e3a857"/><rect x="258" y="983" width="38" height="38" rx="3" fill="#e3a857"/><rect x="305" y="983" width="38" height="38" rx="3" fill="#14120e" stroke="#b98038" stroke-width="1"/><rect x="305" y="983" width="34.2" height="38" rx="3" fill="#e3a857"/><rect x="352" y="983" width="38" height="38" rx="3" fill="#14120e" stroke="#c8beae" stroke-width="1.2" stroke-dasharray="3 3"/><text x="371" y="1009.6" class="x-s" font-size="21" fill="#c8beae" text-anchor="middle">?</text><rect x="399" y="983" width="38" height="38" rx="3" fill="#14120e" stroke="#c8beae" stroke-width="1.2" stroke-dasharray="3 3"/><text x="418" y="1009.6" class="x-s" font-size="21" fill="#c8beae" text-anchor="middle">?</text><rect x="446" y="983" width="38" height="38" rx="3" fill="#14120e" stroke="#c8beae" stroke-width="1.2" stroke-dasharray="3 3"/><text x="465" y="1009.6" class="x-s" font-size="21" fill="#c8beae" text-anchor="middle">?</text><rect x="493" y="983" width="38" height="38" rx="3" fill="#14120e" stroke="#c8beae" stroke-width="1.2" stroke-dasharray="3 3"/><text x="512" y="1009.6" class="x-s" font-size="21" fill="#c8beae" text-anchor="middle">?</text><text x="32" y="1056" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">? = 4.1% with no detected failures.</text><text x="32" y="1079.76" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">Unknown is not the same as accessible.</text><text x="32" y="1140" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">WHAT A PERSON NEEDS TO FINISH</text><path d="M52 1186L52 1416" fill="none" stroke="#3a342b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="1186" r="11" fill="#e3a857"/><text x="78" y="1193" class="x-s" font-size="20" fill="#f6eee1" text-anchor="start">Home page</text><circle cx="52" cy="1232" r="9" fill="#14120e" stroke="#c8beae" stroke-width="1.5" stroke-dasharray="3 3"/><text x="78" y="1239" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Find a date</text><circle cx="52" cy="1278" r="9" fill="#14120e" stroke="#c8beae" stroke-width="1.5" stroke-dasharray="3 3"/><text x="78" y="1285" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Compare places</text><circle cx="52" cy="1324" r="9" fill="#14120e" stroke="#c8beae" stroke-width="1.5" stroke-dasharray="3 3"/><text x="78" y="1331" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Check access</text><circle cx="52" cy="1370" r="9" fill="#14120e" stroke="#c8beae" stroke-width="1.5" stroke-dasharray="3 3"/><text x="78" y="1377" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Fix details</text><circle cx="52" cy="1416" r="9" fill="#14120e" stroke="#c8beae" stroke-width="1.5" stroke-dasharray="3 3"/><text x="78" y="1423" class="x-s" font-size="20" fill="#c8beae" text-anchor="start">Save booking</text><text x="250" y="1193" class="x-s" font-size="17" fill="#e3a857" text-anchor="start">← the scan stops here</text><text x="250" y="1285" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">the rest is unmeasured:</text><text x="250" y="1307.44" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">test it with people</text><rect x="32" y="1450" width="182.4" height="25" rx="12.5" fill="#2b261f"/><text x="123.2" y="1468" class="x-m" font-size="12" fill="#c8beae" text-anchor="middle">ILLUSTRATIVE BOOKING</text><path d="M32 1478L568 1478" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1508" class="x-m" font-size="14" fill="#c8beae" text-anchor="start">WEBAIM MILLION · FEB 2026 · 1,000,000 HOME PAGES · AUTOMATED</text><text x="32" y="1536" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">orchestra.hyperdrift.io/articles/web-accessibility-can-people-finish</text></svg>
