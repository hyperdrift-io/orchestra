<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1560" viewBox="0 0 600 1560" role="img" aria-labelledby="mcp-m-title mcp-m-desc"><title id="mcp-m-title">One sentence, two scopes, no send</title><desc id="mcp-m-desc">Illustrative request: “Find the release blockers and prepare a note for the team.” An assistant interprets it and keeps every source. The first part goes to a project tracker MCP server with a read-blockers scope; the second to a writing workspace with a create-draft scope. Each server checks its own permission. Sending to the team was not asked for and stays closed: delivery is the person’s decision. A correction, “use the mobile release, not the web release”, must replace the selection and revise the same draft. Proposed experiment, not yet run.</desc><style>.x-d{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500}.x-i{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}.x-s{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.x-m{font-family:'IBM Plex Mono',Menlo,monospace;letter-spacing:.06em}</style><rect width="600" height="1560" fill="#14120e"/><text x="32" y="54" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">PART 5 OF 6 · UI &amp; ACCESSIBILITY</text><text x="32" y="111.5" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">One sentence.</text><text x="32" y="158.42" class="x-d" font-size="46" fill="#f6eee1" text-anchor="start">Two scopes. <tspan fill="#f4cd92" class="x-i">No send</tspan>.</text><text x="32" y="211.34" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">Your sentence can cross apps. Your</text><text x="32" y="242.14" class="x-s" font-size="22" fill="#c8beae" text-anchor="start">permission should not grow on the way.</text><text x="32" y="296" class="x-i" font-size="36" fill="#f6eee1" text-anchor="start">“<tspan fill="#90c5b8">Find the release blockers</tspan></text><text x="32" y="338" class="x-i" font-size="36" fill="#f6eee1" text-anchor="start">and <tspan fill="#f4cd92">prepare a note</tspan> for</text><text x="32" y="380" class="x-i" font-size="36" fill="#f6eee1" text-anchor="start">the team.”</text><text x="32" y="452" class="x-d" font-size="26" fill="#f6eee1" text-anchor="start">Assistant</text><text x="32" y="478" class="x-s" font-size="16" fill="#c8beae" text-anchor="start">interprets the sentence, keeps every source</text><path d="M48 496L48 595" fill="none" stroke="#3a342b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 595L80 595" fill="none" stroke="#90c5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="520" width="400" height="150" rx="12" fill="#1b1813" stroke="#90c5b8" stroke-width="1.5"/><text x="102" y="554" class="x-m" font-size="12" fill="#90c5b8" text-anchor="start">MCP · 1</text><text x="102" y="588" class="x-d" font-size="26" fill="#f6eee1" text-anchor="start">Project tracker</text><rect x="102" y="627" width="144.12" height="26" rx="13.0" fill="#2c4a43"/><text x="174.06" y="646" class="x-m" font-size="13" fill="#d6efe8" text-anchor="middle">READ: BLOCKERS</text><rect x="508" y="569" width="8" height="52" rx="4" fill="#90c5b8"/><path d="M528 595l4 4.5l8 -9" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 496L48 781" fill="none" stroke="#3a342b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 781L80 781" fill="none" stroke="#e3a857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="706" width="400" height="150" rx="12" fill="#1b1813" stroke="#e3a857" stroke-width="1.5"/><text x="102" y="740" class="x-m" font-size="12" fill="#e3a857" text-anchor="start">MCP · 2</text><text x="102" y="774" class="x-d" font-size="26" fill="#f6eee1" text-anchor="start">Writing workspace</text><rect x="102" y="813" width="135.54" height="26" rx="13.0" fill="#2c4a43"/><text x="169.77" y="832" class="x-m" font-size="13" fill="#d6efe8" text-anchor="middle">CREATE: DRAFT</text><rect x="508" y="755" width="8" height="52" rx="4" fill="#90c5b8"/><path d="M528 781l4 4.5l8 -9" fill="none" stroke="#90c5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 496L48 967" fill="none" stroke="#3a342b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 967L80 967" fill="none" stroke="#e8a18a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><rect x="80" y="892" width="400" height="150" rx="12" fill="#22160f" stroke="#e8a18a" stroke-width="1.5" stroke-dasharray="5 5"/><text x="102" y="926" class="x-m" font-size="12" fill="#e8a18a" text-anchor="start">MCP · ?</text><text x="102" y="960" class="x-d" font-size="26" fill="#c8beae" text-anchor="start">Team channel</text><rect x="102" y="999" width="152.7" height="26" rx="13.0" fill="#3b211a"/><text x="178.35" y="1018" class="x-m" font-size="13" fill="#e8a18a" text-anchor="middle">SEND: NOT ASKED</text><rect x="508" y="941" width="8" height="52" rx="4" fill="#e8a18a"/><path d="M529 962l10 10M539 962l-10 10" fill="none" stroke="#e8a18a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1092" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">Each server checks its own scope. Nothing in</text><text x="32" y="1115.76" class="x-s" font-size="18" fill="#c8beae" text-anchor="start">the request authorises delivery.</text><rect x="32" y="1160" width="536" height="210" rx="12" fill="#1e1a13" stroke="#b98038" stroke-width="1" stroke-dasharray="3 6"/><text x="56" y="1198" class="x-m" font-size="13" fill="#e3a857" text-anchor="start">CORRECTION</text><text x="56" y="1242" class="x-i" font-size="26" fill="#f6eee1" text-anchor="start">“Use the mobile release,</text><text x="56" y="1274" class="x-i" font-size="26" fill="#f6eee1" text-anchor="start">not the web release.”</text><text x="56" y="1318" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">Replace the selection, withdraw the old</text><text x="56" y="1340.44" class="x-s" font-size="17" fill="#c8beae" text-anchor="start">findings, revise the same draft.</text><path d="M32 1468L568 1468" fill="none" stroke="#3a342b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1498" class="x-m" font-size="14" fill="#c8beae" text-anchor="start">PROPOSED EXPERIMENT · ILLUSTRATIVE REQUEST · NOT YET RUN</text><text x="32" y="1526" class="x-m" font-size="14" fill="#e3a857" text-anchor="start">ai.hyperdrift.io/articles/voice-through-mcp</text></svg>
