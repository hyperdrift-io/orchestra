<!doctype html>
<meta charset="utf-8">
<title>Traction · growth team film</title>
<!--
  The growth-team film, one seekable page: window.seek(t) draws the frame at t seconds. render.cjs samples each locally authored scene.
  Clock = the score (audio/score/b140-3.wav, 140 bpm, bar 1.714 s): near silence 29-33 s, drop 34.29 s, close 68.6 s.
  Voice starts come from timeline.json. The French montage uses the local fixture capture.
-->
<style>
@font-face { font-family: Bricolage; src: url('__PUBLIC__/fonts/bricolage-grotesque-latin.woff2'); font-weight: 200 800; }
:root { --ink:#14120e; --cream:#f6eee1; --gold:#e3a857; --gold-light:#f4cd92; --dim:rgba(246,238,225,.5); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
body { color: var(--cream); font-family: Bricolage, system-ui, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
#glow { background: radial-gradient(ellipse 60% 55% at 50% 52%, rgba(227,168,87,.22), rgba(227,168,87,0) 70%); }
#grain { opacity: .06; background-image: radial-gradient(rgba(246,238,225,.9) 1px, transparent 1px); background-size: 6px 6px; }
#core { position: absolute; left: 960px; top: 560px; width: 0; height: 0; }
#dot { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; background: var(--gold-light); box-shadow: 0 0 40px 12px rgba(244,205,146,.55); }
#dotLabel { position: absolute; left: -200px; width: 400px; top: 30px; text-align: center; font: 500 22px/1 Menlo, monospace; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
.word { position: absolute; white-space: nowrap; font-weight: 700; font-size: 62px; letter-spacing: -.02em; color: var(--cream); transform-origin: center; }
.word b { display: inline-block; transform: translate(-50%, -50%); font-weight: inherit; }
#lines { position: absolute; inset: 0; }
.head { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.035em; line-height: 1.02; }
.head em { font-style: normal; color: var(--gold-light); }
#h1 { top: 330px; font-size: 128px; }
#h2 { top: 500px; font-size: 128px; }
#sub { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font-weight: 500; font-size: 50px; color: rgba(246,238,225,.78); letter-spacing: -.015em; }
#lockup { position: absolute; left: 50%; top: 120px; width: 520px; transform: translateX(-50%); }
#eyebrow { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: 500 24px/1 Menlo, monospace; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.node { position: absolute; transform: translate(-50%, -50%); padding: 14px 26px; border-radius: 999px; font-weight: 700; font-size: 36px; white-space: nowrap; border: 2px solid rgba(227,168,87,.6); background: rgba(20,18,14,.85); }
#you { left: 960px; top: 500px; color: var(--ink); background: var(--cream); border-color: var(--cream); }
#gm { left: 960px; top: 655px; color: var(--ink); background: var(--gold); border-color: var(--gold-light); box-shadow: 0 0 60px rgba(227,168,87,.5); }
#screenWrap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; perspective: 2400px; }
#screen { position: absolute; left: 50%; top: 440px; width: 1640px; height: 701px; margin-left: -820px; margin-top: -350px; border-radius: 22px; overflow: hidden; box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 0 0 2px rgba(227,168,87,.35), 0 0 120px rgba(227,168,87,.18); background: #0d1117; transform-style: preserve-3d; }
#shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
#chip { position: absolute; left: 150px; top: 46px; font: 600 24px/1 Menlo, monospace; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
#caption { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-weight: 700; font-size: 66px; letter-spacing: -.03em; }
#yes { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-weight: 800; font-size: 132px; letter-spacing: -.04em; line-height: 1; text-shadow: 0 10px 60px rgba(0,0,0,.8); }
#os { position: absolute; left: 940px; top: 60px; width: 960px; height: 960px; border-radius: 50%; overflow: hidden; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 71%); }
#osText { position: absolute; left: 120px; top: 300px; width: 860px; }
#osEyebrow { font: 600 24px/1 Menlo, monospace; letter-spacing: .24em; color: var(--gold); text-transform: uppercase; }
#osHead { margin-top: 28px; font-weight: 700; font-size: 96px; letter-spacing: -.035em; line-height: 1.02; }
#osHead em { font-style: normal; color: var(--gold-light); }
#osChips { margin-top: 44px; display: flex; gap: 16px; }
.chipx { padding: 14px 26px; border-radius: 999px; border: 2px solid rgba(227,168,87,.55); font-weight: 700; font-size: 34px; }
#osScale { margin-top: 34px; font-weight: 500; font-size: 44px; color: var(--cream); letter-spacing: -.015em; }
#osScale em { font-style: normal; color: var(--gold-light); }
#close { position: absolute; inset: 0; }
#closeLock { position: absolute; left: 50%; top: 210px; width: 380px; transform: translateX(-50%); }
#closeHead { position: absolute; left: 0; right: 0; top: 360px; text-align: center; font-weight: 800; font-size: 124px; letter-spacing: -.04em; line-height: 1.02; }
#closeHead em { font-style: normal; color: var(--gold-light); }
#closeStart { position: absolute; left: 0; right: 0; top: 670px; text-align: center; font-weight: 500; font-size: 44px; color: var(--dim); }
#door { position: absolute; left: 50%; top: 770px; transform: translateX(-50%); padding: 22px 46px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 800; font-size: 40px; white-space: nowrap; }
#url { position: absolute; left: 0; right: 0; top: 890px; text-align: center; font: 500 26px/1 Menlo, monospace; letter-spacing: .08em; color: var(--dim); }
#label { position: absolute; left: 64px; bottom: 36px; font: 500 21px/1.3 Menlo, monospace; letter-spacing: .04em; color: rgba(246,238,225,.55); }
#flash { background: #fff6e6; mix-blend-mode: screen; }
#vignette { background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
#os {display:grid;place-items:center;background:radial-gradient(ellipse at center,#34291e 0%,transparent 65%);}
#os strong{font-size:115px;letter-spacing:-.08em;color:#e9bf83}
.orbit{position:absolute;width:640px;height:640px;border:3px solid rgba(244,205,146,.5);border-radius:50%;box-shadow:0 0 30px #e3a85722,inset 0 0 12px #e3a85722}
.orbit:before{content:"";position:absolute;top:13.6%;left:13.6%;width:14px;height:14px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 16px 7px #e3a85788}
#osChips{flex-wrap:wrap;gap:12px}.chipx{font-size:31px;padding:10px 19px}#osHead{font-size:84px}
</style>
<div id="stage">
  <div class="layer" id="glow"></div>
  <div class="layer" id="grain"></div>
  <svg class="layer" id="lines" viewBox="0 0 1920 1080"></svg>
  <div id="core"><div id="dot"></div><div id="dotLabel">Your app</div></div>
  <div class="layer" id="words"></div>
  <div class="node" id="you">You</div>
  <div class="node" id="gm">AI Growth Manager</div>
  <img id="lockup" src="__PUBLIC__/brand/traction/lockup-dark.svg" alt="">
  <div id="eyebrow">A growth team for your app</div>
  <div class="head" id="h1"></div>
  <div class="head" id="h2"></div>
  <div id="sub"></div>
  <div id="screenWrap"><div id="screen"><img id="shot" alt=""></div></div>
  <div id="chip"></div>
  <div id="caption"></div>
  <div id="yes">Nothing goes out<br>without your <em style="font-style:normal;color:var(--gold-light)">yes.</em></div>
  <div id="os"><div class="orbit"></div><div class="orbit"></div><div class="orbit"></div><strong>HD OS</strong></div>
  <div id="osText">
    <div id="osEyebrow">HD OS</div>
    <div id="osHead">Build and run your app with <em>HD OS.</em></div>
    <div id="osChips"><span class="chipx">Build</span><span class="chipx">Host</span><span class="chipx">Secure</span><span class="chipx">Support</span></div>
    <div id="osScale">Support as your app <em>grows.</em></div>
  </div>
  <div id="close">
    <img id="closeLock" src="__PUBLIC__/brand/traction/lockup-dark.svg" alt="">
    <div id="closeHead">Grow your app<br>with a <em>team behind you.</em></div>
    <div id="closeStart">Start with your app’s address.</div>
    <div id="door">Try Traction →</div>
    <div id="url">hyperdrift.io/traction</div>
  </div>
  <div id="label"></div>
  <div class="layer" id="vignette"></div>
  <div class="layer" id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const ramp = (t, a, d) => clamp((t - a) / d);
// visible from a (fading in over i) until b (fading out over o)
const win = (t, a, b, i = .35, o = .35) => Math.min(ramp(t, a, i), 1 - ramp(t, b - o, o));
const set = (el, o, tr = '') => { el.style.opacity = o; el.style.transform = tr; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; };
const pad = n => String(n).padStart(4, '0');

const TL = window.TIMELINE; // voice starts, seconds
const DROP = 34.29, CLOSE = 68.6, END = 76;

// The ten jobs from "That takes research, positioning, ..." with each word's start in the line (speech-to-text).
const JOBS = [['Research', .68], ['Positioning', 1.28], ['Customers', 2.1], ['Emails', 2.82], ['A plan', 3.32], ['Market news', 4.42], ['Analytics', 5.2], ['Support', 6.3], ['Hosting', 7.0], ['Security', 7.6]];
// Scattered places around the app in act one, a ring around the Growth Manager in act two.
const SCATTER = [[-560, -300], [520, -330], [-700, 30], [640, 20], [-420, 290], [430, 300], [-150, -380], [170, 390], [780, -150], [-800, -170]];
const words = JOBS.map(([w]) => { const d = document.createElement('div'); d.className = 'word'; d.innerHTML = `<b>${w}</b>`; $('words').appendChild(d); return d; });
const ringPos = (i, t) => { const a = -Math.PI / 2 + i / JOBS.length * Math.PI * 2 + (t - DROP) * .06; return [960 + Math.cos(a) * 660, 655 + Math.sin(a) * 290]; };

const SHOTS = [
  { name: 'read', from: 40.8, to: 43.8, chip: 'First impression', caption: 'It reads your app like a new customer.', label: 'live' },
  { name: 'customers', from: 43.8, to: 45.6, chip: 'Customers', caption: 'It finds people your app could help', label: 'live' },
  { name: 'email', from: 45.6, to: 47.6, chip: 'Email', caption: 'and writes to each in your voice.', label: 'live' },
  { name: 'plan', from: 47.6, to: 51.9, chip: 'Plan', caption: 'Ask in a sentence. Get a plan to your date.', label: 'live' },
  { name: 'market', from: 51.9, to: 54.3, chip: 'Market', caption: 'It keeps up with your market', label: 'market' },
  { name: 'analytics', from: 54.3, to: 56.4, chip: 'Analytics', caption: 'and matches your numbers to the work.', label: 'example' },
  { name: 'approve', from: 56.4, to: 59.2, chip: '', caption: '', label: 'live' },
];
const LABELS = {
  live: 'Traction · recorded 5 Nov 2026 on one of our apps, renamed Yourapp · businesses blurred',
  market: 'Traction’s own board · recorded 6 Nov 2026',
  example: 'Analytics · example board, fictional data',
  os: 'HD OS · illustrative model · scope agreed for each app',
};

function headline(el, html, o, y = 0, s = 1) { if (el._h !== html) { el.innerHTML = html; el._h = html; } set(el, o, `translateY(${y}px) scale(${s})`); }

const pending = [];
function img(el, src) { if (el._src === src) return; el._src = src; el.src = src; pending.push(el.decode().catch(() => {})); }

window.seek = async function seek(t) {
  pending.length = 0;
  const v = k => TL[k];
  // ---------- Act one: alone ----------
  const act1 = 1 - ramp(t, DROP - .05, .1);
  set($('glow'), (t < DROP ? .35 + .5 * ramp(t, 10, 18) - .75 * ramp(t, 28.6, 1.5) + 1.2 * ramp(t, 32.5, 1.8) : 1 - .3 * ramp(t, 59, 1) + .2 * ramp(t, CLOSE, 2)));
  // the app: a point of light that the jobs crowd, then dims in the silence
  const crowd = ease(ramp(t, 24.6, 4.2));
  const dotScale = (t < DROP ? (1 + .25 * Math.sin(t * 3.66)) * (1 - .45 * crowd) * (1 + 2.2 * ease(ramp(t, 32.6, 1.7))) : 0);
  set($('core'), act1 * Math.min(1, ramp(t, .6, 1.2)) * (1 - .55 * ramp(t, 28.6, 1.2) + .55 * ramp(t, 32.6, 1.4)), `scale(${dotScale})`);
  $('dotLabel').style.opacity = win(t, 1.2, 9.6, .8, .6);
  // "You built an app. It works." / "Now it has to meet its market."
  const s1 = v('v01');
  if (t < 10) {
    headline($('h1'), 'You built an app.', win(t, s1 + .1, 5.9, .4, .5), (1 - out(ramp(t, s1 + .1, .6))) * 30 - 120);
    headline($('h2'), '<em>It works.</em>', win(t, s1 + 1.5, 5.9, .3, .5), (1 - out(ramp(t, s1 + 1.5, .5))) * 30 - 140);
    const s2 = v('v02');
    if (t >= 5.9) { headline($('h1'), 'Now it has to', win(t, s2 - .1, 9.9, .35, .5), -120); headline($('h2'), 'meet its <em>market.</em>', win(t, s2 + .3, 9.9, .35, .5), -140); }
  } else if (t < 28.6) {
    const s4 = v('v04');
    headline($('h1'), 'Every week.', win(t, s4, 25.2, .25, .6), -40 + (1 - out(ramp(t, s4, .5))) * 40, 1);
    headline($('h2'), 'On top of <em>building it.</em>', win(t, s4 + 1.1, 25.2, .25, .6), -40 + (1 - out(ramp(t, s4 + 1.1, .5))) * 40, 1);
  } else if (t < DROP) {
    const s5 = v('v05');
    headline($('h1'), 'That’s where', win(t, s5 + .05, 33.6, .4, .4), -60);
    headline($('h2'), 'good apps <em>stall.</em>', win(t, s5 + .5, 33.6, .4, .4), -60);
  } else { set($('h1'), 0); set($('h2'), 0); }
  headline($('sub'), 'A founder on their own, with no team and no plan.', t < DROP ? win(t, v('v05') + 1.8, 33.6, .5, .4) : 0, 40);

  // the jobs: they land one by one on the line's words, then crowd the app; after the drop they become the team's jobs
  const s3 = v('v03');
  words.forEach((el, i) => {
    const at = s3 + JOBS[i][1];
    if (t < DROP) {
      const [x0, y0] = SCATTER[i];
      const k = .38 + .62 * (1 - crowd) - .1 * crowd;
      const jitter = crowd * 9 * Math.sin(t * 23 + i * 7);
      const x = 960 + x0 * k + jitter, y = 560 + y0 * k + jitter * .6;
      const pop = out(ramp(t, at, .25));
      const o = pop * (1 - .78 * ramp(t, v('v04') - .2, .4)) * (1 - ramp(t, 28.5, 1.4)) * (t < 21 ? 1 : 1) + (t > 24.6 && t < 28.5 ? .7 * crowd : 0);
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.color = 'var(--cream)'; el.style.fontSize = '62px';
      set(el, clamp(o), `scale(${(1.6 - .6 * pop) * (1 - .25 * crowd)})`);
    } else {
      const born = DROP + .12 * i;
      const [x, y] = ringPos(i, t);
      const p = out(ramp(t, born, .55));
      const cx = 960 + (x - 960) * p, cy = 655 + (y - 655) * p;
      el.style.left = cx + 'px'; el.style.top = cy + 'px'; el.style.color = 'var(--gold-light)'; el.style.fontSize = '38px';
      set(el, p * (1 - ramp(t, 40.3, .5)), `scale(${.6 + .4 * p})`);
    }
  });
  // lines from each job to the Growth Manager
  const svg = $('lines');
  if (t >= DROP && t < 41) {
    const lo = 1 - ramp(t, 40.3, .5);
    svg.innerHTML = words.map((el, i) => { const p = out(ramp(t, DROP + .12 * i + .2, .6)); const [x, y] = ringPos(i, t); return `<line x1="960" y1="655" x2="${960 + (x - 960) * p}" y2="${655 + (y - 655) * p}" stroke="rgba(227,168,87,${.5 * lo})" stroke-width="2"/>`; }).join('')
      + `<line x1="960" y1="500" x2="960" y2="${500 + 155 * out(ramp(t, v('v07') + 1.8, .5))}" stroke="rgba(246,238,225,${.8 * lo * ramp(t, v('v07') + 1.8, .3)})" stroke-width="3"/>`;
  } else svg.innerHTML = '';

  // ---------- Act two: the team ----------
  const s6 = v('v06'), s7 = v('v07');
  const lockIn = out(ramp(t, DROP, .5));
  set($('lockup'), t >= DROP && t < 41 ? lockIn * (1 - ramp(t, 40.3, .5)) : 0, `translateX(-50%) scale(${1.25 - .25 * lockIn})`);
  set($('eyebrow'), t >= DROP && t < 41 ? out(ramp(t, DROP + .5, .5)) * (1 - ramp(t, 40.3, .5)) : 0);
  const gm = out(ramp(t, s7 + .05, .45));
  set($('gm'), t >= DROP && t < 41 ? Math.max(.0, gm) * (1 - ramp(t, 40.3, .5)) : 0, `translate(-50%,-50%) scale(${.7 + .3 * gm})`);
  const you = out(ramp(t, s7 + 1.85, .4));
  set($('you'), t >= DROP && t < 41 ? you * (1 - ramp(t, 40.3, .5)) : 0, `translate(-50%,-50%) translateY(${-60 * (1 - you)}px) scale(${1 + .12 * Math.max(0, Math.sin((t - s7 - 1.85) * 6)) * (1 - ramp(t, s7 + 2.6, .4))})`);

  // footage on a tilted screen, cut on the beat
  let shot = SHOTS.find(s => t >= s.from && t < s.to);
  const inMontage = t >= 40.8 && t < 59.2;
  const mIn = out(ramp(t, 40.8, .6)), mOut = 1 - ramp(t, 58.8, .45);
  if (inMontage && shot) {
    const local = t - shot.from;
    const frames = { read: 96, customers: 60, email: 66, plan: 135, market: 78, analytics: 72, approve: 90 }[shot.name];
    img($('shot'), window.FRENCH ? `__CAPTURE__/${shot.name}-hero.png` : `__ORIGINAL__/footage/shots/${shot.name}/${pad(Math.min(frames, 1 + Math.floor(local * 30)))}.jpg`);
    const cut = out(ramp(local, 0, .28));
    const ry = -6 + 4 * ((t - 40.8) / 18.4), rx = 3.5 - 1.5 * ((t - 40.8) / 18.4);
    let sc = (.97 + .03 * (local / (shot.to - shot.from))) * (.8 + .2 * mIn);
    let tx = 0, ty = 0;
    if (shot.name === 'approve') { const z = ease(ramp(t, 56.4, 2.4)); sc = 1 + .5 * z; tx = 120 * z; ty = -80 * z; }
    set($('screen'), mIn * mOut, `translate(${tx + (1 - cut) * 70}px, ${ty}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc})`);
    $('screen').style.filter = shot.name === 'approve' ? `brightness(${1 - .55 * ease(ramp(t, 56.6, .8))}) blur(${3 * ease(ramp(t, 56.8, 1))}px)` : `brightness(${.8 + .3 * cut}) contrast(1.05)`;
    headline($('chip'), shot.chip, shot.chip ? cut * mOut : 0, 0);
    headline($('caption'), shot.caption, shot.caption ? cut * mOut : 0, (1 - cut) * 20);
    headline($('label'), LABELS[shot.label], mIn * mOut * .9);
  } else { set($('screen'), 0); set($('chip'), 0); set($('caption'), 0); }
  set($('yes'), win(t, v('v12') - .05, 59.1, .35, .4), `translateY(${(1 - out(ramp(t, v('v12') - .05, .5))) * 30}px)`);

  // ---------- Act three: HD OS ----------
  const s13 = v('v13'), s14 = v('v14');
  const osIn = out(ramp(t, 59.0, .9)), osOut = 1 - ramp(t, 68.4, .5);
  if (t >= 58.9 && t < 69) {
    Array.from($('os').querySelectorAll('.orbit'), (ring, i) => ring.style.transform = `rotate(${i*60+t*2}deg) scaleY(.54)`);
    set($('os'), osIn * osOut, `scale(${.9 + .1 * osIn + .03 * ramp(t, 59, 9.6)})`);
    set($('osText'), osOut);
    $('osEyebrow').style.opacity = out(ramp(t, 59.2, .5));
    $('osHead').style.opacity = out(ramp(t, s13, .4)); $('osHead').style.transform = `translateY(${(1 - out(ramp(t, s13, .5))) * 24}px)`;
    const starts = [.28, .8, 1.16, 1.76];
    [...$('osChips').children].forEach((c, i) => { const p = out(ramp(t, s14 + starts[i] - .05, .3)); c.style.opacity = p; c.style.transform = `translateY(${(1 - p) * 16}px)`; c.style.background = p > .9 ? 'rgba(227,168,87,.12)' : 'transparent'; });
    $('osScale').style.opacity = out(ramp(t, s14 + 3.25, .45));
    headline($('label'), LABELS.os, osIn * osOut * .9);
  } else { set($('os'), 0); set($('osText'), 0); }
  if (!inMontage && !(t >= 58.9 && t < 69)) set($('label'), 0);

  // ---------- Close ----------
  const s16 = v('v16'), s17 = v('v17');
  set($('close'), t >= CLOSE ? 1 : 0);
  if (t >= CLOSE) {
    const h = out(ramp(t, s16 - .1, .7));
    $('closeLock').style.opacity = out(ramp(t, CLOSE + .2, .6));
    $('closeHead').style.opacity = h; $('closeHead').style.transform = `translateY(${(1 - h) * 30}px)`;
    $('closeStart').style.opacity = out(ramp(t, s17, .5));
    const d = out(ramp(t, s17 + 1.0, .5)); $('door').style.opacity = d; $('door').style.transform = `translateX(-50%) scale(${.9 + .1 * d})`;
    $('url').style.opacity = out(ramp(t, s17 + 1.4, .5));
  }
  // the drop: a flash; small flashes on montage cuts
  let fl = t >= DROP ? Math.max(0, 1 - (t - DROP) / .22) * .95 : 0;
  for (const s of SHOTS.slice(1)) if (t >= s.from) fl = Math.max(fl, Math.max(0, 1 - (t - s.from) / .12) * .18);
